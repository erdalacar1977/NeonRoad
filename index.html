<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Neon Road 5.1 — Ultimate Garage</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#010206;
  font-family:'Segoe UI',Roboto,Arial,sans-serif;
  color:white;
}

body{touch-action:none}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.hidden{display:none!important}

/* ================= HUD ================= */

#hud{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.hud-top{
  position:absolute;
  top:20px;
  left:20px;
  right:20px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.hud-cluster{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.stat-card{
  background:rgba(2,6,18,.78);
  border:1px solid rgba(0,234,255,.4);
  border-left:3px solid #00eaff;
  padding:8px 14px;
  backdrop-filter:blur(8px);
  box-shadow:0 0 15px rgba(0,234,255,.15);
}

.stat-title{
  color:#6c829b;
  font-size:9px;
  letter-spacing:2px;
  font-weight:bold;
}

.stat-value{
  font-size:20px;
  font-weight:900;
  color:white;
  text-shadow:0 0 10px #00eaff;
  font-family:monospace;
}

.hud-controls{
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.btn-icon{
  width:44px;
  height:44px;
  background:rgba(2,6,18,.85);
  border:1px solid rgba(0,234,255,.5);
  color:#00eaff;
  font-size:18px;
  cursor:pointer;
}

.gauge-container{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  width:min(420px,85vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.nitro-bar-outer{
  width:100%;
  height:12px;
  background:#000;
  border:1px solid rgba(0,234,255,.6);
  padding:2px;
}

#nitroFill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#00eaff,#0055ff,#ff0077);
  box-shadow:0 0 15px #00eaff;
}

.rpm-text{
  font-size:11px;
  letter-spacing:3px;
  color:#00eaff;
  font-weight:bold;
}

/* ================= TOUCH ================= */

#mobileControls{
  position:absolute;
  inset:0;
  z-index:12;
  pointer-events:none;
  display:flex;
  justify-content:space-between;
  padding:20px;
  align-items:flex-end;
}

.touch-zone{
  width:40vw;
  height:40vh;
  pointer-events:auto;
  display:flex;
  align-items:flex-end;
}

.touch-btn{
  width:80px;
  height:80px;
  border-radius:50%;
  background:rgba(0,234,255,.08);
  border:2px solid rgba(0,234,255,.4);
  color:#00eaff;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(4px);
}

.nitro-touch{
  border-color:#ff0077;
  color:#ff0077;
}

/* ================= PANELS ================= */

.overlay-panel{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at center,rgba(3,8,22,.55),rgba(1,2,6,.94));
  backdrop-filter:blur(12px);
}

.panel-card{
  width:min(620px,94vw);
  max-height:92vh;
  overflow:auto;
  background:rgba(4,10,26,.92);
  border:1px solid rgba(0,234,255,.5);
  padding:30px;
  text-align:center;
  box-shadow:0 0 50px rgba(0,234,255,.2);
}

.title-glow{
  font-size:clamp(36px,8vw,64px);
  font-weight:900;
  font-style:italic;
  letter-spacing:6px;
  line-height:.95;
  color:white;
  text-shadow:0 0 10px #fff,0 0 20px #00eaff,0 0 40px #00eaff;
}

.title-glow span{
  color:#ff0077;
  text-shadow:0 0 10px #ff0077,0 0 30px #ff0077;
}

.sub-title{
  color:#5d7590;
  font-size:11px;
  letter-spacing:4px;
  margin:12px 0 25px;
}

.menu-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.btn-primary{
  padding:14px;
  background:linear-gradient(90deg,rgba(0,234,255,.15),rgba(0,100,255,.18));
  border:1px solid #00eaff;
  color:white;
  font-weight:bold;
  font-size:14px;
  letter-spacing:3px;
  cursor:pointer;
}

.btn-secondary{
  padding:11px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.15);
  color:#a7bbd0;
  cursor:pointer;
}

.section-title{
  margin:18px 0 8px;
  text-align:left;
  color:#00eaff;
  font-size:11px;
  letter-spacing:3px;
}

.garage-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.car-option{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.12);
  padding:10px;
  cursor:pointer;
  transition:.2s;
}

.car-option:hover,
.car-option.active{
  border-color:#00eaff;
  box-shadow:0 0 20px rgba(0,234,255,.18);
}

.car-preview{
  height:75px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.car-shape{
  width:75px;
  height:30px;
  border-radius:18px 18px 8px 8px;
  background:var(--carColor,#00eaff);
  box-shadow:0 0 20px var(--carColor,#00eaff);
}

.car-name{
  font-weight:bold;
  font-size:12px;
}

.car-stat{
  font-size:9px;
  color:#70849a;
  margin-top:4px;
}

.custom-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.option-btn{
  min-height:42px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.12);
  color:white;
  font-size:10px;
  cursor:pointer;
}

.option-btn.active{
  border-color:#ff0077;
  box-shadow:0 0 15px rgba(255,0,119,.25);
}

.color-dot{
  width:20px;
  height:20px;
  border-radius:50%;
  margin:auto;
  border:2px solid rgba(255,255,255,.5);
}

.preview-stage{
  height:210px;
  margin:12px 0;
  border:1px solid rgba(0,234,255,.15);
  background:
    radial-gradient(circle at center,rgba(0,234,255,.08),transparent 55%),
    linear-gradient(180deg,#050a17,#010206);
  position:relative;
  overflow:hidden;
}

.preview-label{
  position:absolute;
  top:8px;
  left:10px;
  color:#00eaff;
  font-size:9px;
  letter-spacing:2px;
}

.results-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0;
}

.result-box{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.1);
  padding:12px;
}

.result-box label{
  font-size:9px;
  color:#5d7590;
  letter-spacing:2px;
  display:block;
}

.result-box span{
  font-size:22px;
  font-weight:bold;
  color:#00eaff;
}

@media(max-width:650px){
  .garage-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .custom-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .stat-card{
    padding:6px 9px;
  }

  .stat-value{
    font-size:15px;
  }
}
</style>
</head>

<!-- ================= HUD ================= -->

<script>

/* ============================================================
   NEON ROAD 5.1
   VEHICLE / GARAGE SYSTEM
============================================================ */

const $ = id => document.getElementById(id);

let scene;
let camera;
let renderer;
let composer;

let audioCtx;
let engineOsc;
let engineGain;

let isPlaying = false;
let isPaused = false;

let score = 0;
let coins = 0;
let distance = 0;
let maxAchievedSpeed = 0;

let traffic = [];
let coinsList = [];
let rainSystem;
let roadMesh;
let roadMaterial;

const clock = new THREE.Clock();

/* ============================================================
   SAVE
============================================================ */

const SAVE_KEY = "neonRoad51Garage";

let saveData = JSON.parse(
  localStorage.getItem(SAVE_KEY) || "null"
) || {

  selectedCar:0,

  paint:0,
  body:0,
  spoiler:0,
  wheels:0,
  neon:0,
  exhaust:0

};

function saveGame(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(saveData)
  );

}

/* ============================================================
   VEHICLE DATABASE
============================================================ */

const carTypes = [

  {
    name:"NEON X",
    type:"SUPERCAR",
    color:0x00eaff,
    maxSpeed:240,
    acceleration:1.2,
    handling:1.0,
    scale:1
  },

  {
    name:"VORTEX GT",
    type:"HYPERCAR",
    color:0xff0077,
    maxSpeed:285,
    acceleration:1.35,
    handling:.9,
    scale:1.02
  },

  {
    name:"PHANTOM R",
    type:"JDM",
    color:0x9b59ff,
    maxSpeed:260,
    acceleration:1.25,
    handling:1.2,
    scale:.98
  },

  {
    name:"NIGHT SUV",
    type:"SUV",
    color:0x42ff66,
    maxSpeed:210,
    acceleration:.95,
    handling:.85,
    scale:1.15
  },

  {
    name:"STREET GT",
    type:"COUPE",
    color:0xffb000,
    maxSpeed:250,
    acceleration:1.15,
    handling:1.1,
    scale:1
  },

  {
    name:"CYBER X",
    type:"HYPER GT",
    color:0xffffff,
    maxSpeed:310,
    acceleration:1.45,
    handling:1.0,
    scale:1.03
  }

];

/* ============================================================
   CUSTOMIZATION
============================================================ */

const paints = [

  {name:"CYAN",color:0x00eaff},
  {name:"PINK",color:0xff0077},
  {name:"PURPLE",color:0x8d4dff},
  {name:"RED",color:0xff2020},
  {name:"GOLD",color:0xffb000},
  {name:"GREEN",color:0x00ff72},
  {name:"WHITE",color:0xf4f8ff},
  {name:"BLACK",color:0x080a0d}

];

const bodyKits = [
  "STANDART",
  "SPORT",
  "RACING",
  "WIDEBODY"
];

const spoilers = [
  "YOK",
  "GT",
  "CARBON",
  "EXTREME"
];

const wheels = [
  "STOCK",
  "SPORT",
  "RACING",
  "TURBINE",
  "CYBER"
];

const neons = [

  {name:"CYAN",color:0x00eaff},
  {name:"PINK",color:0xff0077},
  {name:"PURPLE",color:0x9b4dff},
  {name:"GREEN",color:0x00ff66},
  {name:"GOLD",color:0xffb000},
  {name:"WHITE",color:0xffffff}

];

const exhausts = [
  "NORMAL",
  "BLUE FLAME",
  "CYBER FLAME"
];

/* ============================================================
   VEHICLE STATE
============================================================ */

const vehicle = {

  mesh:null,
  bodyMesh:null,

  x:0,
  targetX:0,

  lane:1,
  lanes:[-5.2,0,5.2],

  speed:0,
  targetSpeed:0,

  maxSpeed:240,

  nitro:100,
  nitroActive:false,

  health:3,
  invulnerable:0,

  wheels:[],
  headlights:[],
  taillights:[],

  neonMesh:null,
  spoilerMesh:null,
  bodyKitMesh:null,
  exhaustMesh:null

};

/* ============================================================
   MATERIAL HELPERS
============================================================ */

function mat(color,metal=.5,rough=.3){

  return new THREE.MeshStandardMaterial({

    color,
    metalness:metal,
    roughness:rough

  });

}

function emissiveMat(color){

  return new THREE.MeshStandardMaterial({

    color,
    emissive:color,
    emissiveIntensity:2,
    metalness:.4,
    roughness:.15

  });

}

/* ============================================================
   WHEEL CREATION
============================================================ */

function createWheel(style){

  const group = new THREE.Group();

  const tire = new THREE.Mesh(

    new THREE.CylinderGeometry(
      .42,
      .42,
      .28,
      20
    ),

    new THREE.MeshStandardMaterial({

      color:0x050608,
      roughness:.85,
      metalness:.15

    })

  );

  tire.rotation.z = Math.PI/2;

  group.add(tire);

  let rimColor = 0x777777;

  if(style === 1) rimColor = 0xaaaaaa;
  if(style === 2) rimColor = 0xff0077;
  if(style === 3) rimColor = 0x00eaff;
  if(style === 4) rimColor = 0xffffff;

  const rim = new THREE.Mesh(

    new THREE.CylinderGeometry(
      .25,
      .25,
      .3,
      style === 4 ? 8 : 16
    ),

    new THREE.MeshStandardMaterial({

      color:rimColor,
      metalness:.95,
      roughness:.15

    })

  );

  rim.rotation.z = Math.PI/2;

  group.add(rim);

  for(let i=0;i<5;i++){

    const spoke = new THREE.Mesh(

      new THREE.BoxGeometry(
        .07,
        .04,
        .38
      ),

      new THREE.MeshStandardMaterial({

        color:rimColor,
        metalness:1,
        roughness:.1

      })

    );

    spoke.position.x = .16;

    spoke.rotation.x =
      i * Math.PI * 2 / 5;

    rim.add(spoke);

  }

  return group;

}

/* ============================================================
   REALISTIC PROCEDURAL CAR
============================================================ */

function createDetailedCar(
  carData,
  customization,
  isPlayer=false
){

  const root = new THREE.Group();

  const paint =
    paints[customization.paint]?.color ||
    carData.color;

  const neon =
    neons[customization.neon]?.color ||
    0x00eaff;

  const bodyMaterial =
    new THREE.MeshStandardMaterial({

      color:paint,
      metalness:.9,
      roughness:.18

    });

  /* MAIN BODY */

  const body = new THREE.Mesh(

    new THREE.BoxGeometry(
      2.25,
      .58,
      4.35
    ),

    bodyMaterial

  );

  body.position.y=.58;

  root.add(body);

  /* HOOD */

  const hood = new THREE.Mesh(

    new THREE.BoxGeometry(
      2.08,
      .18,
      1.25
    ),

    bodyMaterial

  );

  hood.position.set(
    0,
    .82,
    -1.28
  );

  root.add(hood);

  /* FRONT NOSE */

  const nose = new THREE.Mesh(

    new THREE.BoxGeometry(
      2.0,
      .35,
      .55
    ),

    bodyMaterial

  );

  nose.position.set(
    0,
    .55,
    -2.02
  );

  root.add(nose);

  /* CABIN */

  const cabinMat =
    new THREE.MeshPhysicalMaterial({

      color:0x02050b,
      metalness:.8,
      roughness:.08,
      transparent:true,
      opacity:.82

    });

  const cabin = new THREE.Mesh(

    new THREE.BoxGeometry(
      1.55,
      .65,
      1.85
    ),

    cabinMat

  );

  cabin.position.set(
    0,
    1.0,
    -.25
  );

  cabin.rotation.x=.04;

  root.add(cabin);

  /* ROOF */

  const roof = new THREE.Mesh(

    new THREE.BoxGeometry(
      1.35,
      .12,
      1.55
    ),

    bodyMaterial

  );

  roof.position.set(
    0,
    1.34,
    -.25
  );

  root.add(roof);

  /* SIDE MIRRORS */

  for(const side of [-1,1]){

    const mirror = new THREE.Mesh(

      new THREE.BoxGeometry(
        .18,
        .12,
        .32
      ),

      bodyMaterial

    );

    mirror.position.set(
      side*1.12,
      1.0,
      -.55

    root.add(mirror);

  }

  /* HEADLIGHTS */

  for(const side of [-1,1]){

    const light = new THREE.Mesh(

      new THREE.BoxGeometry(
        .52,
        .16,
        .08
      ),

    );

          1.8,

      );

      root.add(spot);

    }

  /* FRONT GRILLE */

  const grille = new THREE.Mesh(

      .12,
      .08

    .52,

  );

  for(const side of [-1,1]){

      new THREE.BoxGeometry(

        .14,
        .08

      emissiveMat(0xff0018)

      side*.65,
      .72,

    );

    vehicle.taillights.push(light);

  /* WHEELS */

    [ 1.12,.45, 1.38]

      p[0],
      p[1],
      p[2]
    );

    root.add(wheel);

    if(isPlayer)
      vehicle.wheels.push(wheel);

  });

  /* BODY KIT */

  if(customization.body > 0){

    const sideKitMat =
      new THREE.MeshStandardMaterial({

        color:paint,
        metalness:.9,
        roughness:.15

      });

    const width =
      customization.body === 3 ?

    for(const side of [-1,1]){

      const sideKit = new THREE.Mesh(

        new THREE.BoxGeometry(
          .16,
          .18,
          3.3
        ),

        sideKitMat

      );

      sideKit.position.set(
        side*width,
        .42,
        0
      );

      root.add(sideKit);

    }

  }

  /* FRONT SPLITTER */

  if(customization.body >= 2){

    const splitter = new THREE.Mesh(

      new THREE.BoxGeometry(
        2.35,
        .10,
        .28
      ),

      new THREE.MeshStandardMaterial({

        color:0x030507,
        metalness:.8,
        roughness:.2

      })

    );

    splitter.position.set(
      0,
      .35,
      -2.2
    );

    root.add(splitter);

  }

  /* REAR DIFFUSER */

  if(customization.body >= 2){

    const diffuser = new THREE.Mesh(

      new THREE.BoxGeometry(
        1.85,
        .20,
        .25
      ),

      new THREE.MeshStandardMaterial({

        color:0x020305,
        metalness:.8,
        roughness:.2

      })

    );

    diffuser.position.set(
      0,
      .38,
      2.15
    );

    root.add(diffuser);

  }

  /* SPOILER */

  if(customization.spoiler > 0){

    const spoilerColor =
      customization.spoiler >= 2 ?
      0x080a0d :
      paint;

    const spoilerMat =
      new THREE.MeshStandardMaterial({

        color:spoilerColor,
        metalness:.8,
        roughness:.15

      });

    const wing = new THREE.Mesh(

      new THREE.BoxGeometry(
        customization.spoiler === 3 ? 2.5 : 2.0,
        .12,
        .32
      ),

      spoilerMat

    );

    wing.position.set(
      0,
      1.35,
      1.72
    );

    root.add(wing);

    for(const side of [-1,1]){

      const support = new THREE.Mesh(

        new THREE.BoxGeometry(
          .10,
          .48,
          .10
        ),

        spoilerMat

      );

      support.position.set(
        side*.72,
        1.12,
        1.72
      );

      root.add(support);

    }

  }

  /* NEON UNDERGLOW */

  if(customization.neon >= 0){

    const glowMat =
      new THREE.MeshBasicMaterial({

        color:neon,
        transparent:true,
        opacity:.65,
        side:THREE.DoubleSide

      });

    const glow = new THREE.Mesh(

      new THREE.PlaneGeometry(
        2.7,
        4.7
      ),

      glowMat

    );

    glow.rotation.x=Math.PI/2;

    glow.position.y=.08;

    root.add(glow);

    if(isPlayer)
      vehicle.neonMesh=glow;

  }

  /* EXHAUST */

  if(customization.exhaust > 0){

    const flameColor =
      customization.exhaust === 1 ?
      0x00aaff :
      0xff0077;

    for(const side of [-1,1]){

      const exhaust = new THREE.Mesh(

        new THREE.CylinderGeometry(
          .10,
          .16,
          .42,
          12
        ),

        new THREE.MeshStandardMaterial({

          color:0x22252a,
          metalness:1,
          roughness:.2

        })

      );

      exhaust.rotation.x=Math.PI/2;

      exhaust.position.set(
        side*.48,
        .45,
        2.34
      );

      root.add(exhaust);

      if(isPlayer){

        const flame = new THREE.Mesh(

          new THREE.ConeGeometry(
            .13,
            .55,
            10
          ),

          emissiveMat(flameColor)

        );

        flame.rotation.x=-Math.PI/2;

        flame.position.set(
          side*.48,
          .45,
          2.72
        );

        flame.visible=false;

        root.add(flame);

        if(!vehicle.exhaustMesh)
          vehicle.exhaustMesh=[];

        vehicle.exhaustMesh.push(flame);

      }

    }

  }

  /* SCALE */

  root.scale.setScalar(
    carData.scale || 1
  );

  return root;

}

/* ============================================================
   AUDIO
============================================================ */

function initAudioEngine(){

  if(audioCtx)
    return;

  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  engineOsc =
    audioCtx.createOscillator();

  const filter =
    audioCtx.createBiquadFilter();

  engineGain =
    audioCtx.createGain();

  engineOsc.type="sawtooth";

  engineOsc.frequency.value=40;

  filter.type="lowpass";

  filter.frequency.value=280;

  engineGain.gain.value=.001;

  engineOsc
    .connect(filter);

  filter
    .connect(engineGain);

  engineGain
    .connect(audioCtx.destination);

  engineOsc.start();

}

function updateEngineAudio(){

  if(!audioCtx)
    return;

  const ratio =
    vehicle.speed /
    vehicle.maxSpeed;

  engineOsc.frequency
    .setTargetAtTime(
      40+
      ratio*170+
      (vehicle.nitroActive?60:0),
      audioCtx.currentTime,
      .05
    );

  engineGain.gain
    .setTargetAtTime(
      isPlaying?.18:.001,
      audioCtx.currentTime,
      .1
    );

}

function playSoundFX(type){

  if(!audioCtx)
    return;

  const now =
    audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  if(type==="coin"){

    osc.type="sine";

    osc.frequency.setValueAtTime(
      900,
      now
    );

    osc.frequency.exponentialRampToValueAtTime(
      1400,
      now+.12
    );

    gain.gain.setValueAtTime(
      .3,
      now
    );

    gain.gain.linearRampToValueAtTime(
      .01,
      now+.12
    );

    osc.start(now);
    osc.stop(now+.12);

  }

  if(type==="crash"){

    osc.type="sawtooth";

    osc.frequency.setValueAtTime(
      150,
      now
    );

    osc.frequency.linearRampToValueAtTime(
      30,
      now+.35
    );

    gain.gain.setValueAtTime(
      .6,
      now
    );

    gain.gain.linearRampToValueAtTime(
      .01,
      now+.35
    );

    osc.start(now);
    osc.stop(now+.35);

  }

}

/* ============================================================
   ROAD
============================================================ */

function generateWetRoadTextures(){

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width=512;
  canvas.height=512;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle="#080a10";

  ctx.fillRect(
    0,
    0,
    512,
    512
  );

  for(
    let i=0;
    i<15000;
    i++
  ){

    ctx.fillStyle =
      Math.random()>.5 ?
      "rgba(255,255,255,.03)" :
      "rgba(0,0,0,.2)";

    ctx.fillRect(
      Math.random()*512,
      Math.random()*512,
      2,
      2
    );

  }

  const texture =
    new THREE.CanvasTexture(
      canvas
    );

  texture.wrapS =
    THREE.RepeatWrapping;

  texture.wrapT =
    THREE.RepeatWrapping;

  texture.repeat.set(
    1,
    40
  );

  return texture;

}

function buildRoad(){

  const roadGeo =
    new THREE.PlaneGeometry(
      16,
      1000
    );

  const roadTex =
    generateWetRoadTextures();

  roadMaterial =
    new THREE.MeshStandardMaterial({

      color:0x0a0d14,

      roughness:.2,

      metalness:.8,

      map:roadTex

    });

  roadMesh =
    new THREE.Mesh(
      roadGeo,
      roadMaterial
    );

  roadMesh.rotation.x =
    -Math.PI/2;

  roadMesh.position.z =
    -450;

  roadMesh.receiveShadow=true;

  scene.add(
    roadMesh
  );

  for(
    const side of [-1,1]
  ){

    const rail =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          .2,
          .2,
          1000
        ),

        new THREE.MeshBasicMaterial({

          color:
            side===-1 ?
            0x00eaff :
            0xff0077

        })

      );

    rail.position.set(
      side*8,
      .1,
      -450
    );

    scene.add(
      rail
    );

  }

  /* LANE MARKINGS */

  for(
    let i=0;
    i<100;
    i++
  ){

    for(
      const x of [-2.6,2.6]
    ){

      const mark =
        new THREE.Mesh(

          new THREE.BoxGeometry(
            .08,
            .015,
            7
          ),

          new THREE.MeshBasicMaterial({
            color:0x607080
          })

        );

      mark.position.set(
        x,
        .015,
        -i*12
      );

      scene.add(
        mark
      );

    }

  }

}

/* ============================================================
   CITY
============================================================ */

function buildCyberCity(){

  const geo =
    new THREE.BoxGeometry(
      1,1,1
    );

  for(
    let i=0;
    i<70;
    i++
  ){

    const h =
      20+
      Math.random()*70;

    const w =
      8+
      Math.random()*14;

    const d =
      10+
      Math.random()*20;

    const material =
      new THREE.MeshStandardMaterial({

        color:0x030712,

        roughness:.9,

        metalness:.1

      });

    const b =
      new THREE.Mesh(
        geo,
        material
      );

    const side =
      i%2===0 ?
      -1 :
      1;

    b.scale.set(
      w,
      h,
      d
    );

    b.position.set(
      side*
      (18+
      Math.random()*30),
      h/2,
      -i*18
    );

    scene.add(
      b
    );

    if(
      Math.random()>.3
    ){

      const win =
        new THREE.Mesh(

          new THREE.PlaneGeometry(
            w*.8,
            h*.7
          ),

          new THREE.MeshBasicMaterial({

            color:
              Math.random()>.5 ?
              0x00eaff :
              0xff0077,

            wireframe:true

          })

        );

      win.position.set(
        b.position.x,
        h/2,
        b.position.z
      );

      win.rotation.y =
        side===-1 ?
        -Math.PI/2 :
        Math.PI/2;

      scene.add(
        win
      );

    }

  }

}

      20
    );

  const material =
    new THREE.MeshStandardMaterial({

      color:0xffd700,

      metalness:.95,

      roughness:.08,

      emissive:0x8a5a00,

      emissiveIntensity:.4

    });

  for(
    let i=0;
    i<18;
    i++
  ){

    const coin =
      new THREE.Mesh(
        geo,
        material
      );

    coin.rotation.x =
      Math.PI/2;

    coin.position.set(

      vehicle.lanes[
        Math.floor(
          Math.random()*3
        )
      ],

      .7,

      -80-
      i*38

    );

    scene.add(
      coin
    );

    coinsList.push(
      coin
    );

  }

}

/* ============================================================
   RAIN
============================================================ */

function buildRainSystem(){

  const count=1200;

  const geometry =
    new THREE.BufferGeometry();

  const positions =
    new Float32Array(
      count*3
    );

  for(
    let i=0;
    i<count*3;
    i+=3
  ){

    positions[i]=
      (Math.random()-.5)*40;

    positions[i+1]=
      Math.random()*25;

    positions[i+2]=
      (Math.random()-.5)*80;

  }

  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
      positions,
      3
    )
  );

  const material =
    new THREE.PointsMaterial({

      color:0x00eaff,

      size:.1,

      transparent:true,

      opacity:.6

    });

  rainSystem =
    new THREE.Points(
      geometry,
      material
    );

  scene.add(
    rainSystem
  );

}

/* ============================================================
   CONTROLS
============================================================ */

function setupInputHandlers(){

  window.addEventListener(
    "keydown",
    e=>{

      if(
        !isPlaying ||
        isPaused
      )
        return;

      if(
        e.key==="ArrowLeft" ||
        e.key==="a" ||
        e.key==="A"
      )
        changeLane(-1);

      if(
        e.key==="ArrowRight" ||
        e.key==="d" ||
        e.key==="D"
      )
        changeLane(1);

      if(
        e.key===" " ||
        e.key==="Shift"
      )
        triggerNitro(true);

    }
  );

  window.addEventListener(
    "keyup",
    e=>{

      if(
        e.key===" " ||
        e.key==="Shift"
      )
        triggerNitro(false);

    }
  );

  $("touchLeft")
    .addEventListener(
      "touchstart",
      e=>{
        e.preventDefault();
        changeLane(-1);
      }
    );

  $("touchRight")
    .addEventListener(
      "touchstart",
      e=>{
        e.preventDefault();
        changeLane(1);
      }
    );

  $("touchNitro")
    .addEventListener(
      "touchstart",
      e=>{
        e.preventDefault();
        triggerNitro(true);
      }
    );

  $("touchNitro")
    .addEventListener(
      "touchend",
      e=>{
        e.preventDefault();
        triggerNitro(false);
      }
    );

}

function changeLane(dir){

  vehicle.lane =
    Math.max(
      0,
      Math.min(
        2,
        vehicle.lane+dir
      )
    );

  vehicle.targetX =
    vehicle.lanes[
      vehicle.lane
    ];

  if(
    navigator.vibrate
  )
    navigator.vibrate(25);

}

function triggerNitro(val){

  vehicle.nitroActive =
    val &&
    vehicle.nitro>5;

}

/* ============================================================
   GAME LOOP
============================================================ */

function animate(){

  requestAnimationFrame(
    animate
  );

  const delta =
    Math.min(
      clock.getDelta(),
      .05
    );

  if(
    isPlaying &&
    !isPaused
  ){

    const carData =
      carTypes[
        saveData.selectedCar
      ];

    vehicle.maxSpeed =
      carData.maxSpeed;

    const targetSpd =
      vehicle.nitroActive ?
      vehicle.maxSpeed*1.3 :
      vehicle.maxSpeed;

    vehicle.speed +=
      (
        targetSpd-
        vehicle.speed
      ) *
      delta*
      carData.acceleration;

    const speedRatio =
      vehicle.speed/
      vehicle.maxSpeed;

    if(
      vehicle.speed>
      maxAchievedSpeed
    )
      maxAchievedSpeed =
        Math.floor(
          vehicle.speed
        );

    /* NITRO */

    if(
      vehicle.nitroActive
    ){

      vehicle.nitro =
        Math.max(
          0,
          vehicle.nitro-
          delta*25
        );

      if(
        vehicle.nitro<=0
      )
        vehicle.nitroActive=false;

    }else{

      vehicle.nitro =
        Math.min(
          100,
          vehicle.nitro+
          delta*10
        );

    }

    /* STEERING */

    const dx =
      vehicle.targetX-
      vehicle.x;

    vehicle.x +=
      dx*
      delta*
      (8*
      carData.handling);

    vehicle.mesh.position.x =
      vehicle.x;

    vehicle.mesh.rotation.z =
      -dx*.035;

    vehicle.mesh.rotation.x =
      vehicle.nitroActive ?
      -.05 :
      .02;

    /* WHEELS */

    vehicle.wheels
      .forEach(
        wheel=>{
          wheel.rotation.x +=
            delta*
            vehicle.speed*
            .15;
        }
      );

    /* NEON */

    if(
      vehicle.neonMesh
    ){

      vehicle.neonMesh.material.opacity =
        .5+
        Math.sin(
          clock.getElapsedTime()*8
        )*.15;

    }

    /* EXHAUST FLAME */

    if(
      vehicle.exhaustMesh
    ){

      vehicle.exhaustMesh
        .forEach(
          flame=>{
            flame.visible =
              vehicle.nitroActive;
          }
        );

    }

    /* ROAD */

    roadMaterial.map.offset.y -=
      delta*
      speedRatio*
      8;

    /* TRAFFIC */

    traffic.forEach(
      t=>{

        t.position.z +=
          delta*
          (
            vehicle.speed*.3-
            t.userData.speed
          );

        if(
          t.position.z>10
        ){

          t.position.z =
            -250-
            Math.random()*250;

          t.position.x =
            vehicle.lanes[
              Math.floor(
                Math.random()*3
              )
            ];

        }

        if(
          vehicle.invulnerable<=0 &&
          Math.abs(
            t.position.z-
            vehicle.mesh.position.z
          )<3.2 &&
          Math.abs(
            t.position.x-
            vehicle.x
          )<1.7
        ){

          handleCrash();

        }

      }
    );

    /* COINS */

    coinsList.forEach(
      c=>{

        c.rotation.z +=
          delta*4;

        c.position.z +=
          delta*
          vehicle.speed*.3;

        if(
          Math.abs(
            c.position.z-
            vehicle.mesh.position.z
          )<2.3 &&
          Math.abs(
            c.position.x-
            vehicle.x
          )<1.4
        ){

          coins+=10;

          score+=100;

          playSoundFX(
            "coin"
          );

          c.position.z =
            -220-
            Math.random()*180;

          c.position.x =
            vehicle.lanes[
              Math.floor(
                Math.random()*3
              )
            ];

        }

        else if(
          c.position.z>10
        ){

          c.position.z =
            -220-
            Math.random()*180;

        }

      }
    );

    /* INVULNERABILITY */

    if(
      vehicle.invulnerable>0
    ){

      vehicle.invulnerable -=
        delta;

      vehicle.mesh.visible =
        Math.floor(
          clock.getElapsedTime()*15
        )%2===0;

    }else{

      vehicle.mesh.visible=true;

    }

    /* RAIN */

    const pos =
      rainSystem
      .geometry
      .attributes
      .position
      .array;

    for(
      let i=1;
      i<pos.length;
      i+=3
    ){

      pos[i]-=
        delta*40;

      if(
        pos[i]<0
      )
        pos[i]=25;

    }

    rainSystem
      .geometry
      .attributes
      .position
      .needsUpdate=true;

    /* CAMERA */

    camera.position.x +=
      (
        vehicle.x*.35-
        camera.position.x
      )*
      delta*6;

    camera.position.y =
      4.5;

    camera.position.z =
      9;

    camera.fov =
      60+
      speedRatio*15;

    camera.updateProjectionMatrix();

    /* STATS */

    distance +=
      delta*
      vehicle.speed*
      .2;

    score +=
      Math.floor(
        delta*
        vehicle.speed
      );

    updateEngineAudio();

    updateHUD();

  }

  composer.render();

}

/* ============================================================
   CRASH
============================================================ */

function handleCrash(){

  playSoundFX(
    "crash"
  );

  vehicle.health--;

  vehicle.invulnerable=2;

  if(
    navigator.vibrate
  )
    navigator.vibrate(
      [100,50,100]
    );

  if(
    vehicle.health<=0
  )
    endGame();

}

/* ============================================================
   START
============================================================ */

function startGame(){

  initAudioEngine();

  if(
    audioCtx.state==="suspended"
  )
    audioCtx.resume();

  buildPlayerVehicle();

  vehicle.x=0;
  vehicle.targetX=0;

  vehicle.lane=1;

  vehicle.speed=0;

  vehicle.nitro=100;

  vehicle.health=3;

  vehicle.invulnerable=0;

  score=0;
  coins=0;
  distance=0;
  maxAchievedSpeed=0;

  isPlaying=true;
  isPaused=false;

  $("mainMenu")
    .classList.add("hidden");

  $("garage")
    .classList.add("hidden");

  $("gameOver")
    .classList.add("hidden");

  $("hud")
    .classList.remove("hidden");

  if(
    "ontouchstart" in window
  ){

    $("mobileControls")
      .classList.remove(
        "hidden"
      );

  }

}

/* ============================================================
   END GAME
============================================================ */

function endGame(){

  isPlaying=false;

  $("hud")
    .classList.add(
      "hidden"
    );

  $("mobileControls")
    .classList.add(
      "hidden"
    );

  $("resScore").innerText =
    score;

  $("resCoins").innerText =
    coins;

  $("resDist").innerText =
    Math.floor(
      distance
    )+
    "m";

  $("resSpeed").innerText =
    maxAchievedSpeed+
    " KM/H";

  $("gameOver")
    .classList.remove(
      "hidden"
    );

}

/* ============================================================
   PAUSE
============================================================ */

function togglePause(){

  if(!isPlaying)
    return;

  isPaused=
    !isPaused;

}

/* ============================================================
   MAIN MENU
============================================================ */

function returnMainMenu(){

  $("gameOver")
    .classList.add(
      "hidden"
    );

  $("mainMenu")
    .classList.remove(
      "hidden"
    );

}

/* ============================================================
   HUD
============================================================ */

function updateHUD(){

  $("scoreVal")
    .innerText =
    score;

  $("speedVal")
    .innerText =
    Math.floor(
      vehicle.speed
    );

  $("coinVal")
    .innerText =
    coins;

  $("healthVal")
    .innerText =
    "♥".repeat(
      Math.max(
        0,
        vehicle.health
      )
    );

  $("nitroFill")
    .style.width =
    vehicle.nitro+
    "%";

  $("rpmText")
    .innerText =
    vehicle.nitroActive ?
    "⚡ NITRO BOOST ACTIVE" :
    "NITRO BOOST - READY";

}

/* ============================================================
   RESIZE
============================================================ */

function onWindowResize(){

  camera.aspect =
    window.innerWidth/
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  composer.setSize(
    window.innerWidth,
    window.innerHeight
  );

}

/* ============================================================
   START ENGINE
============================================================ */

window.onload=initEngine;

</script>
