<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020308;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}canvas{display:block}
#app{position:fixed;inset:0} .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:radial-gradient(circle at 50% 45%,rgba(14,28,50,.45),rgba(0,0,0,.92))}.hidden{display:none!important}
.panel{width:min(1100px,94vw);max-height:92vh;overflow:auto;padding:28px;border:1px solid rgba(0,238,255,.35);background:linear-gradient(145deg,rgba(4,9,18,.94),rgba(8,5,20,.9));box-shadow:0 0 45px rgba(0,220,255,.12),inset 0 0 30px rgba(255,0,200,.05);border-radius:18px}.title{font-size:clamp(32px,6vw,70px);letter-spacing:8px;font-weight:900;text-align:center;text-shadow:0 0 12px #00eaff,0 0 35px #ff00d4;margin:5px 0 8px}.sub{text-align:center;color:#8fa9b8;letter-spacing:4px;margin-bottom:28px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:620px;margin:auto}.btn{appearance:none;border:1px solid rgba(0,238,255,.42);background:linear-gradient(180deg,rgba(9,26,39,.95),rgba(5,10,18,.95));color:#e9fbff;padding:14px 18px;border-radius:10px;font-size:15px;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 0 14px rgba(0,238,255,.08);transition:.15s}.btn:hover{transform:translateY(-2px);border-color:#00eaff;box-shadow:0 0 20px rgba(0,238,255,.25)}.btn.primary{border-color:#ff00d4;box-shadow:0 0 22px rgba(255,0,212,.2)}.btn.danger{border-color:#ff365f}.wide{grid-column:1/-1}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.sectionTitle{font-size:26px;letter-spacing:4px;font-weight:900}.back{padding:9px 14px}
#hud{position:absolute;inset:0;z-index:10;pointer-events:none}.hudTop{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;gap:10px}.hudBox{background:rgba(2,8,15,.68);border:1px solid rgba(0,238,255,.25);border-radius:10px;padding:9px 12px;min-width:105px;backdrop-filter:blur(8px)}.label{font-size:10px;color:#6e9aaa;letter-spacing:2px}.value{font-size:20px;font-weight:900}.hudRight{display:flex;gap:8px}.hudButton{pointer-events:auto;width:42px;height:42px;border-radius:10px;background:rgba(3,10,18,.8);border:1px solid #00eaff;color:#fff;font-size:20px;cursor:pointer}.bars{position:absolute;left:16px;bottom:18px;width:min(320px,70vw)}.barWrap{margin-top:8px}.barTitle{display:flex;justify-content:space-between;font-size:10px;color:#8baab6;letter-spacing:2px}.bar{height:8px;background:#0c1520;border:1px solid #263541;border-radius:10px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#00eaff,#ff00d4);box-shadow:0 0 12px #00eaff}.nitro{background:linear-gradient(90deg,#ffe600,#ff6b00)}
#touch{position:absolute;inset:0;z-index:12;pointer-events:none}.touchBtn{position:absolute;bottom:24px;width:78px;height:78px;border-radius:50%;background:rgba(5,14,22,.5);border:1px solid rgba(0,238,255,.55);color:#fff;font-size:28px;pointer-events:auto;user-select:none}.leftBtn{left:24px}.rightBtn{left:114px}.nitroBtn{right:24px;border-color:#ff00d4;font-size:16px;font-weight:900}.pauseOverlay{background:rgba(0,0,0,.68);backdrop-filter:blur(7px)}.pauseCard{width:min(480px,90vw);padding:28px;border:1px solid #00eaff;background:rgba(2,8,15,.95);border-radius:18px;box-shadow:0 0 40px rgba(0,238,255,.18);text-align:center}.pauseCard h2{letter-spacing:5px;margin-top:0}.pauseCard .btn{display:block;width:100%;margin:10px 0}
.garageGrid{display:grid;grid-template-columns:1.25fr .9fr;gap:20px}.preview{min-height:460px;border:1px solid rgba(0,238,255,.2);border-radius:15px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(20,50,75,.35),rgba(0,0,0,.25))}.preview canvas{position:absolute;inset:0}.previewInfo{position:absolute;left:16px;bottom:14px;z-index:2}.previewInfo h2{margin:0 0 5px;font-size:30px;letter-spacing:3px}.previewInfo p{margin:0;color:#8fa9b8}.garageSide{display:flex;flex-direction:column;gap:12px}.carCards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.carCard{border:1px solid #263c49;border-radius:10px;padding:10px;cursor:pointer;background:#071018}.carCard.active{border-color:#00eaff;box-shadow:0 0 18px rgba(0,238,255,.18)}.carCard .mini{height:65px;border-radius:7px;margin-bottom:7px}.carCard b{display:block;font-size:12px}.carCard span{font-size:10px;color:#718e99}.mods{display:grid;gap:9px}.modRow{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px}.modRow>label{font-size:10px;color:#8baab6;letter-spacing:1px}.choices{display:flex;gap:5px;flex-wrap:wrap}.choice{font-size:10px;padding:7px 8px;border:1px solid #253742;background:#071018;border-radius:7px;cursor:pointer}.choice.active{border-color:#ff00d4;color:#fff;box-shadow:0 0 10px rgba(255,0,212,.16)}.colors{display:flex;gap:7px}.swatch{width:28px;height:28px;border-radius:50%;border:2px solid #24343e;cursor:pointer}.swatch.active{border-color:#fff;box-shadow:0 0 14px #fff}.statsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:18px;border:1px solid #1c3542;border-radius:12px;background:#061018}.stat b{display:block;font-size:26px;margin-top:6px}.upgradeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.upgrade{padding:18px;border:1px solid #1c3542;border-radius:12px;background:#061018}.upgrade h3{margin:0 0 8px}.level{color:#00eaff}.shopItem{padding:18px;border:1px solid #1c3542;border-radius:12px;background:#061018;margin-bottom:10px}.shopItem{display:flex;justify-content:space-between;align-items:center;gap:12px}.coin{color:#ffe600;font-weight:900}.small{font-size:11px;color:#78929d}.toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);z-index:50;padding:12px 18px;border:1px solid #00eaff;background:rgba(0,10,17,.9);border-radius:10px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:800px){.garageGrid{grid-template-columns:1fr}.preview{min-height:340px}.menu{grid-template-columns:1fr}.statsGrid,.upgradeGrid{grid-template-columns:1fr}.panel{padding:18px}.hudBox{min-width:auto}.hudBox:nth-child(3){display:none}.carCards{grid-template-columns:1fr 1fr 1fr}.title{letter-spacing:4px}}
</style>

<div id="hud" class="hidden">
  <div class="hudTop">
    <div style="display:flex;gap:8px"><div class="hudBox"><div class="label">SKOR</div><div class="value" id="score">0</div></div><div class="hudBox"><div class="label">HIZ</div><div class="value"><span id="speed">0</span> <small>KM/H</small></div></div><div class="hudBox"><div class="label">COIN</div><div class="value coin" id="runCoins">0</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const $=id=>document.getElementById(id);
const SAVE_KEY='neonRoad53Save';
const defaultSave={coins:0,bestScore:0,games:0,distance:0,bestSpeed:0,bestCombo:0,selectedCar:'neon',unlockedCars:{neon:true,vortex:false,phantom:false},color:'#00eaff',bodyKit:'stock',spoiler:'none',wheels:'sport',neon:'under',exhaust:'dual',upgrades:{engine:0,nitro:0,tires:0,turbo:0,brakes:0},skins:{cyan:true,pink:false,gold:false,red:false},settings:{volume:.7,effects:true,music:true,rain:true,shake:true}};
let save=loadSave();
let scene,camera,renderer,composer,clock,worldGroup,roadGroup,cityGroup,rainGroup,player,playerParts={},garageRenderer,garageScene,garageCamera,garageLight,garageCar,garageClock;
let isPlaying=false,isPaused=false,gameOver=false,score=0,runCoins=0,health=100,nitro=100,distance=0,combo=0,speed=120,lane=1,targetX=0,shake=0,lastSpawn=0,lastCoin=0;
let traffic=[],coins=[],particles=[];let keys={left:false,right:false,nitro:false};let audioCtx=null,engineOsc=null,engineGain=null;
const lanes=[-3.5,0,3.5];
const CAR_DATA={
 neon:{name:'NEON X',desc:'Futuristic street coupe',cost:0,body:0x16d9ff,roof:0x101a28,scale:1},
 vortex:{name:'VORTEX',desc:'Low-profile super sports',cost:1500,body:0xff197f,roof:0x150b18,scale:1.02},
 phantom:{name:'PHANTOM',desc:'Aggressive hypercar',cost:3500,body:0xffd33d,roof:0x17130a,scale:1.06}
};
const colorMap={cyan:'#00eaff',pink:'#ff168d',gold:'#ffd43b',red:'#ff3d4f'};

function loadSave(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return structuredClone(defaultSave);const s=JSON.parse(raw);return deepMerge(structuredClone(defaultSave),s)}catch(e){return structuredClone(defaultSave)}}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k])a[k]=deepMerge(a[k],b[k]);else a[k]=b[k]}return a}
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(save))}
function money(n){return Number(n||0).toLocaleString('tr-TR')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1500)}
function hideAllScreens(){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'))}
function closeScreens(){if(isPlaying)return quitToMenu();hideAllScreens();$('mainMenu').classList.remove('hidden')}

function initEngine(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x02040a);scene.fog=new THREE.FogExp2(0x02040a,.018);
 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,900);camera.position.set(0,5.4,12);camera.lookAt(0,1,-10);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('app').appendChild(renderer.domElement);
 const hemi=new THREE.HemisphereLight(0x8ab8ff,0x08000d,1.15);scene.add(hemi);const dir=new THREE.DirectionalLight(0xffffff,1.4);dir.position.set(-20,30,15);dir.castShadow=true;scene.add(dir);const cyan=new THREE.PointLight(0x00eaff,5,70);cyan.position.set(-14,7,-25);scene.add(cyan);const pink=new THREE.PointLight(0xff00d4,4,60);pink.position.set(15,5,-45);scene.add(pink);
 worldGroup=new THREE.Group();scene.add(worldGroup);buildWorld();clock=new THREE.Clock();
 setupInput();window.addEventListener('resize',onResize);window.addEventListener('keydown',e=>{if(e.code==='Escape'){if(isPlaying)togglePause();return}if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'){keys.nitro=true;e.preventDefault()}});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight')keys.nitro=false});
 buildGarageUI();buildUpgradeUI();buildShopUI();buildStatsUI();buildSettingsUI();
 animate();
}

function buildWorld(){
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x03050a,roughness:.92,metalness:.05}));ground.rotation.x=-Math.PI/2;ground.position.y=-.35;ground.position.z=-150;worldGroup.add(ground);
 roadGroup=new THREE.Group();worldGroup.add(roadGroup);const roadMat=new THREE.MeshStandardMaterial({color:0x111821,roughness:.24,metalness:.55});const road=new THREE.Mesh(new THREE.PlaneGeometry(14,500),roadMat);road.rotation.x=-Math.PI/2;road.position.y=-.3;road.position.z=-150;roadGroup.add(road);
 for(let i=0;i<90;i++){const z=-i*6;for(const x of [-7.25,7.25]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,5),new THREE.MeshBasicMaterial({color:0x00eaff}));rail.position.set(x,.02,z);roadGroup.add(rail)}for(const x of [-1.75,1.75]){const line=new THREE.Mesh(new THREE.BoxGeometry(.06,.015,2.5),new THREE.MeshBasicMaterial({color:0x5b6c76,transparent:true,opacity:.65}));line.position.set(x,-.285,z);roadGroup.add(line)}}
 cityGroup=new THREE.Group();worldGroup.add(cityGroup);for(let i=0;i<75;i++){const z=-10-i*7-Math.random()*4;for(const side of [-1,1]){const h=5+Math.random()*20,w=2+Math.random()*5,d=3+Math.random()*5;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:0x07101b,roughness:.85,metalness:.2}));b.position.set(side*(10+Math.random()*8),h/2-.3,z);cityGroup.add(b);for(let r=0;r<Math.min(6,Math.floor(h/3));r++){const win=new THREE.Mesh(new THREE.PlaneGeometry(.35,.55),new THREE.MeshBasicMaterial({color:Math.random()>.5?0x00eaff:0xff00d4}));win.position.set(b.position.x-side*(w/2+.01),1+r*2.7,z-d/2-.01);win.rotation.y=side>0?Math.PI/2:-Math.PI/2;cityGroup.add(win)}}}
 rainGroup=new THREE.Group();worldGroup.add(rainGroup);for(let i=0;i<360;i++){const g=new THREE.BufferGeometry();const y=Math.random()*25;const x=(Math.random()-.5)*80;const z=-Math.random()*230;g.setAttribute('position',new THREE.Float32BufferAttribute([x,y,z,x,y-1.6,z],3));const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x75d9ff,transparent:true,opacity:.28}));rainGroup.add(l)}
}

function mat(color,metal=.5,rough=.28,emissive=0,ei=0){return new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough,emissive,emissiveIntensity:ei})}
function box(g,s,p,m,rot){const o=new THREE.Mesh(new THREE.BoxGeometry(...s),m);o.position.set(...p);if(rot)o.rotation.set(...rot);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}
function cyl(g,r,h,p,m,rot){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),m);o.position.set(...p);if(rot)o.rotation.set(...rot);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}
function wheel(g,x,z,r=.62,w=.38,neon=false){const tire=new THREE.Mesh(new THREE.CylinderGeometry(r,r,w,20),mat(0x050608,.05,.95));tire.rotation.z=Math.PI/2;tire.position.set(x,.35,z);tire.castShadow=true;g.add(tire);const rim=new THREE.Mesh(new THREE.CylinderGeometry(r*.55,r*.55,w+.02,16),mat(neon?0x00eaff:0x8795a0,.85,.18));rim.rotation.z=Math.PI/2;rim.position.set(x,.35,z);g.add(rim);const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.17,r*.17,w+.04,12),mat(0x101820,.9,.16));hub.rotation.z=Math.PI/2;hub.position.set(x,.35,z);g.add(hub);return {tire,rim,hub}}

function createCar(type,mods=save){const d=CAR_DATA[type];const g=new THREE.Group();g.scale.setScalar(d.scale);const bodyColor=new THREE.Color(mods.color||'#00eaff');const body=mat(bodyColor,0.82,.2,bodyColor,0.05);const dark=mat(0x070b12,.65,.2);const glass=mat(0x0b2030,.45,.08,0x001827,.2);const light=mat(0xe9fbff,.25,.08,0x00eaff,5);const red=mat(0xff163e,.2,.12,0xff0030,4);
 playerParts={};
 const base=box(g,[5.4,.55,9.4],[0,.72,0],body);playerParts.base=base;
 if(type==='neon'){
   box(g,[4.7,.45,4.2],[0,1.15,-1.6],body);box(g,[3.8,1.45,3.3],[0,1.82,.75],glass);box(g,[4.2,.22,3.1],[0,2.47,.75],dark);box(g,[5.2,.45,1.2],[0,.95,-4.15],body);box(g,[5.1,.42,1.0],[0,.96,4.15],body);
 }else if(type==='vortex'){
   box(g,[5.8,.48,8.7],[0,.76,0],body);box(g,[4.25,.85,3.9],[0,1.42,.65],glass);box(g,[4.6,.18,3.2],[0,2.0,.65],dark);box(g,[5.7,.32,1.2],[0,.94,-4.1],body);box(g,[5.8,.4,1.3],[0,.98,4.0],body);box(g,[.65,.55,2.1],[-2.55,1.0,-2.1],body);box(g,[.65,.55,2.1],[2.55,1.0,-2.1],body);
 }else{
   box(g,[6.0,.5,9.1],[0,.76,0],body);box(g,[4.0,.78,3.6],[0,1.45,.6],glass);box(g,[4.45,.2,3.1],[0,2.02,.6],dark);box(g,[5.9,.34,1.45],[0,.95,-4.15],body);box(g,[6.0,.4,1.55],[0,.98,4.0],body);box(g,[.75,.6,2.4],[-2.62,1.0,-1.8],body);box(g,[.75,.6,2.4],[2.62,1.0,-1.8],body);
 }
 // headlights, grille, taillights
 box(g,[1.35,.12,.18],[-1.35,.98,-4.72],light);box(g,[1.35,.12,.18],[1.35,.98,-4.72],light);box(g,[2.1,.2,.18],[0,.93,-4.74],dark);box(g,[1.3,.12,.18],[-1.4,.98,4.72],red);box(g,[1.3,.12,.18],[1.4,.98,4.72],red);
 // mirrors
 box(g,[.35,.22,.75],[-2.5,1.65,.05],body);box(g,[.35,.22,.75],[2.5,1.65,.05],body);
 const wheels=[];for(const x of [-2.75,2.75])for(const z of [-2.75,2.65])wheels.push(wheel(g,x,z,.65,.42,mods.neon!=='none'));
 playerParts.wheels=wheels;playerParts.body=body;playerParts.glass=glass;playerParts.light=light;
 playerParts.spoiler=new THREE.Group();g.add(playerParts.spoiler);applySpoiler(type,playerParts.spoiler,mods.spoiler,body);
 playerParts.kit=new THREE.Group();g.add(playerParts.kit);applyKit(type,playerParts.kit,mods.bodyKit,body,dark);
 playerParts.exhaust=new THREE.Group();g.add(playerParts.exhaust);applyExhaust(playerParts.exhaust,mods.exhaust);
 applyNeon(g,mods.neon);
 return g;
}
function clearGroup(g){while(g.children.length)g.remove(g.children[0])}
function applySpoiler(type,g,kind,body){clearGroup(g);if(kind==='none')return;const width=type==='phantom'?5.2:type==='vortex'?4.9:4.5;box(g,[width,.18,.35],[0,2.15,4.05],body);box(g,[.18,.7,.18],[-width/2+.4,1.75,4.05],body);box(g,[.18,.7,.18],[width/2-.4,1.75,4.05],body);if(kind==='racing')box(g,[width*.82,.12,.22],[0,2.65,4.05],mat(0x151b22,.8,.18))}
function applyKit(type,g,kind,body,dark){clearGroup(g);if(kind==='stock')return;const w=type==='phantom'?3.05:type==='vortex'?2.95:2.75;box(g,[w,.22,.5],[-(w/2+.1),.75,-.1],dark);box(g,[w,.22,.5],[(w/2+.1),.75,-.1],dark);box(g,[5.7,.2,.45],[0,.78,-4.4],kind==='race'?mat(0x151a22,.8,.15):body)}
function applyExhaust(g,kind){clearGroup(g);if(kind==='stock')return;const count=kind==='racing'?4:2;for(let i=0;i<count;i++){const x=(i-(count-1)/2)*.62;cyl(g,.16,.42,[x,.68,4.72],mat(0x9da7ae,.9,.12),[Math.PI/2,0,0])}}
function applyNeon(g,kind){const colors={under:0x00eaff,side:0xff00d4,full:0xb100ff};if(kind==='none')return;const c=colors[kind]||0x00eaff;const m=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.8});if(kind==='under'||kind==='full'){const n=new THREE.Mesh(new THREE.BoxGeometry(4.8,.04,7.2),m);n.position.y=.12;g.add(n)}if(kind==='side'||kind==='full'){for(const x of [-2.82,2.82]){const n=new THREE.Mesh(new THREE.BoxGeometry(.035,.12,7),m);n.position.set(x,.38,0);g.add(n)}}}

function createPlayer(){if(player)scene.remove(player);player=createCar(save.selectedCar,save);player.position.set(0,0,5.5);player.rotation.y=Math.PI;scene.add(player);targetX=0;lane=1}
function buildTraffic(type){const colors=[0xd51d2d,0x19a9d9,0xf0d21a,0x8a53ff,0xe8e8e8];const g=new THREE.Group();const c=colors[Math.floor(Math.random()*colors.length)];const body=mat(c,.7,.28);const dark=mat(0x0a0d12,.5,.25);const glass=mat(0x172a38,.35,.1);let w=2.4,l=4.7,h=1.2;if(type==='suv'){w=3.1;l=5.3;h=1.7}if(type==='pickup'){w=3;l=5.5;h=1.45}if(type==='super'){w=2.8;l=5.3;h=.95}if(type==='police'){w=2.6;l=5;h=1.35}box(g,[w,h*.45,l],[0,.55,0],body);box(g,[w*.78,h*.55,l*.42],[0,.95,.45],glass);for(const x of [-w*.48,w*.48])for(const z of [-l*.3,l*.3])wheel(g,x,z,.43,.3,false);box(g,[w*.3,.12,.18],[0,.7,-l/2-.05],mat(0xeefcff,.1,.1,0x00eaff,4));if(type==='police'){box(g,[.7,.18,.45],[0,1.65,0],mat(0x131a22,.5,.15));box(g,[.3,.08,.2],[-.2,1.77,0],mat(0xff0030,.1,.1,0xff0030,5));box(g,[.3,.08,.2],[.2,1.77,0],mat(0x00eaff,.1,.1,0x00eaff,5))}return g}
function spawnTraffic(){const types=['sedan','coupe','suv','police','pickup','super'];const type=types[Math.floor(Math.random()*types.length)];const g=buildTraffic(type);g.position.set(lanes[Math.floor(Math.random()*3)],0,-120-Math.random()*35);g.userData.type=type;g.userData.speed=.72+Math.random()*.35;scene.add(g);traffic.push(g)}
function spawnCoin(){const c=new THREE.Mesh(new THREE.TorusGeometry(.45,.12,8,18),mat(0xffd83d,.7,.15,0xffb000,2));c.rotation.x=Math.PI/2;c.position.set(lanes[Math.floor(Math.random()*3)],1.1,-120-Math.random()*25);scene.add(c);coins.push(c)}
function burst(pos,color=0x00eaff){for(let i=0;i<16;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.05),new THREE.MeshBasicMaterial({color}));p.position.copy(pos);p.userData.v=new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5);p.userData.life=.7;scene.add(p);particles.push(p)}}

function startGame(){hideAllScreens();$('hud').classList.remove('hidden');$('touch').classList.remove('hidden');isPlaying=true;isPaused=false;gameOver=false;score=0;runCoins=0;health=100;nitro=100;distance=0;combo=0;speed=110;lastSpawn=0;lastCoin=0;traffic.forEach(x=>scene.remove(x));coins.forEach(x=>scene.remove(x));traffic=[];coins=[];particles=[];createPlayer();updateHUD();clock.getDelta();startAudio()}
function updateGame(dt){
 const base=115+save.upgrades.engine*6+save.upgrades.turbo*4;let boost=1;if(keys.nitro&&nitro>0){boost=1.42;nitro=Math.max(0,nitro-dt*(18-save.upgrades.nitro*1.5))}else nitro=Math.min(100,nitro+dt*(5+save.upgrades.nitro*.7));speed=THREE.MathUtils.lerp(speed,base*boost,dt*2.5);const laneSpeed=10+save.upgrades.tires*1.2;if(keys.left){lane=Math.max(0,lane-1);keys.left=false}if(keys.right){lane=Math.min(2,lane+1);keys.right=false}targetX=lanes[lane];player.position.x=THREE.MathUtils.lerp(player.position.x,targetX,Math.min(1,dt*laneSpeed));player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,(targetX-player.position.x)*-.045,dt*10);player.rotation.x=Math.sin(performance.now()*.004)*.006;
 const flow=speed*dt*.085;roadGroup.position.z+=flow;if(roadGroup.position.z>6)roadGroup.position.z-=6;cityGroup.position.z+=flow;if(cityGroup.position.z>7)cityGroup.position.z-=7;rainGroup.position.z+=flow*1.5;if(rainGroup.position.z>8)rainGroup.position.z-=8;
 lastSpawn+=dt;lastCoin+=dt;if(lastSpawn>.85-Math.min(.28,distance/10000)){spawnTraffic();lastSpawn=0}if(lastCoin>.48){spawnCoin();lastCoin=0}
 for(let i=traffic.length-1;i>=0;i--){const t=traffic[i];t.position.z+=flow*(1.0-t.userData.speed);t.rotation.y=Math.sin(performance.now()*.001+i)*.002;if(t.position.z>14){scene.remove(t);traffic.splice(i);score+=10;combo++;continue}if(Math.abs(t.position.x-player.position.x)<2.55&&Math.abs(t.position.z-player.position.z)<3.7){scene.remove(t);traffic.splice(i);const damage=Math.max(5,14-save.upgrades.brakes*1.3);health-=damage;combo=0;shake=save.settings.shake?.25:0;burst(player.position,0xff1744);if(health<=0){endGame();return}}}
 for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.position.z+=flow*1.05;c.rotation.z+=dt*5;if(c.position.z>14){scene.remove(c);coins.splice(i);continue}if(Math.abs(c.position.x-player.position.x)<1.7&&Math.abs(c.position.z-player.position.z)<2.6){runCoins++;score+=75+combo*3;combo=Math.min(999,combo+1);burst(c.position,0xffd83d);scene.remove(c);coins.splice(i)}}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.position.addScaledVector(p.userData.v,dt);p.userData.v.y-=7*dt;p.userData.life-=dt;p.scale.multiplyScalar(.96);if(p.userData.life<=0){scene.remove(p);particles.splice(i)}}
 distance+=speed*dt/3600;score+=Math.floor(speed*dt*.35);save.bestSpeed=Math.max(save.bestSpeed,Math.round(speed));save.distance+=speed*dt/3600;save.bestCombo=Math.max(save.bestCombo,combo);updateHUD();updateAudio();
 const targetFov=boost>1?68:62;camera.fov=THREE.MathUtils.lerp(camera.fov,targetFov,dt*3);camera.updateProjectionMatrix();let sx=0,sy=0;if(shake>0){shake=Math.max(0,shake-dt);sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake}camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.18+sx,dt*5);camera.position.y=THREE.MathUtils.lerp(camera.position.y,5.4+sy,dt*5);camera.lookAt(player.position.x*.2,1,-12)
}
function updateHUD(){$('score').textContent=money(score);$('speed').textContent=Math.round(speed);$('runCoins').textContent=runCoins;$('healthText').textContent=Math.max(0,Math.round(health))+'%';$('healthFill').style.width=Math.max(0,health)+'%';$('nitroText').textContent=Math.round(nitro)+'%';$('nitroFill').style.width=nitro+'%'}
function endGame(){if(gameOver)return;gameOver=true;isPlaying=false;$('hud').classList.add('hidden');$('touch').classList.add('hidden');isPaused=false;save.coins+=runCoins;save.bestScore=Math.max(save.bestScore,score);save.games++;persist();$('finalStats').innerHTML=`SKOR <b>${money(score)}</b><br>TOPLANAN COIN <span class="coin">${money(runCoins)}</span><br>MESAFE ${distance.toFixed(2)} KM<br>EN YÜKSEK HIZ ${Math.round(speed)} KM/H`;hideAllScreens();$('gameOver').classList.remove('hidden');stopAudio()}

function togglePause(){if(!isPlaying)return;isPaused=!isPaused;$('pauseMenu').classList.toggle('hidden',!isPaused);if(isPaused)pauseAudio();else{clock.getDelta();resumeAudio()}}
function resumeGame(){if(!isPlaying)return;isPaused=false;$('pauseMenu').classList.add('hidden');clock.getDelta();resumeAudio()}
function openGarageFromPause(){isPaused=true;$('pauseMenu').classList.add('hidden');$('hud').classList.add('hidden');$('touch').classList.add('hidden');openGarage(true)}
function quitToMenu(){isPlaying=false;isPaused=false;gameOver=false;$('pauseMenu').classList.add('hidden');$('hud').classList.add('hidden');$('touch').classList.add('hidden');stopAudio();hideAllScreens();$('mainMenu').classList.remove('hidden');persist()}

function openGarage(fromPause=false){if(!fromPause&&!isPlaying){}hideAllScreens();$('garage').classList.remove('hidden');$('garageCoins').textContent=money(save.coins);buildGarageUI();initGaragePreview()}
function buildGarageUI(){const cards=$('carCards');cards.innerHTML='';for(const id of Object.keys(CAR_DATA)){const d=CAR_DATA[id];const owned=save.unlockedCars[id];const el=document.createElement('div');el.className='carCard'+(save.selectedCar===id?' active':'');el.innerHTML=`<div class="mini" style="background:linear-gradient(135deg,${new THREE.Color(d.body).getStyle()},#080b12)"></div><b>${d.name}</b><span>${owned?'SAHİP':money(d.cost)+' ◆'}</span>`;el.onclick=()=>selectCar(id);cards.appendChild(el)}
 const m=$('mods');const rows=[['Renk','color'],['Body Kit','bodyKit'],['Spoiler','spoiler'],['Jant','wheels'],['Neon','neon'],['Egzoz','exhaust']];m.innerHTML='';for(const [label,key] of rows){const row=document.createElement('div');row.className='modRow';const values=key==='color'?Object.keys(colorMap):key==='bodyKit'?['stock','street','race']:key==='spoiler'?['none','gt','racing']:key==='wheels'?['sport','carbon','neon']:key==='neon'?['none','under','side','full']:['stock','dual','racing'];row.innerHTML=`<label>${label}</label><div class="choices"></div>`;const c=row.querySelector('.choices');if(key==='color'){for(const v of values){const s=document.createElement('button');s.className='swatch'+(save.color===colorMap[v]?' active':'');s.style.background=colorMap[v];s.title=v;s.onclick=()=>{if(!save.skins[v]){toast('Bu renk Mağaza\'dan açılmalı');return}save.color=colorMap[v];buildGarageUI();initGaragePreview()};c.appendChild(s)}}else{for(const v of values){const b=document.createElement('button');b.className='choice'+(save[key]===v?' active':'');b.textContent=v.toUpperCase();b.onclick=()=>{save[key]=v;buildGarageUI();initGaragePreview()};c.appendChild(b)}}m.appendChild(row)} }
function selectCar(id){if(!save.unlockedCars[id]){const cost=CAR_DATA[id].cost;if(save.coins<cost){toast('Yeterli coin yok');return}save.coins-=cost;save.unlockedCars[id]=true;toast(CAR_DATA[id].name+' açıldı!')}save.selectedCar=id;persist();buildGarageUI();initGaragePreview()}
function applyGarage(){persist();if(isPlaying){createPlayer();$('garage').classList.add('hidden');$('hud').classList.remove('hidden');$('touch').classList.remove('hidden');isPaused=false;resumeAudio()}else{toast('Garaj ayarları kaydedildi');buildGarageUI()}}

function initGaragePreview(){if(!garageRenderer){garageRenderer=new THREE.WebGLRenderer({antialias:true,alpha:true});garageRenderer.setPixelRatio(Math.min(devicePixelRatio,1.5));$('garagePreview').prepend(garageRenderer.domElement);garageScene=new THREE.Scene();garageCamera=new THREE.PerspectiveCamera(38,1,.1,100);garageCamera.position.set(8,4.7,11);garageCamera.lookAt(0,1,0);garageScene.add(new THREE.HemisphereLight(0x99bbff,0x110018,2));garageLight=new THREE.PointLight(0x00eaff,8,40);garageLight.position.set(-6,6,7);garageScene.add(garageLight);const p=new THREE.PointLight(0xff00d4,7,40);p.position.set(7,3,-5);garageScene.add(p);garageClock=new THREE.Clock()}resizeGarage();if(garageCar)garageScene.remove(garageCar);garageCar=createCar(save.selectedCar,save);garageCar.rotation.y=-.35;garageScene.add(garageCar);$('previewName').textContent=CAR_DATA[save.selectedCar].name;$('previewDesc').textContent=CAR_DATA[save.selectedCar].desc}
function resizeGarage(){if(!garageRenderer)return;const el=$('garagePreview');const w=el.clientWidth,h=el.clientHeight;garageRenderer.setSize(w,h,false);garageCamera.aspect=w/h;garageCamera.updateProjectionMatrix()}

function buildUpgradeUI(){const list=[['engine','MOTOR','Hızlanma ve maksimum hız'],['nitro','NITRO','Nitro kapasitesi ve dolum'],['tires','LASTİK','Şerit değişimi ve yol tutuş'],['turbo','TURBO','Ek hız desteği'],['brakes','FREN','Çarpışma hasarı azaltma']];$('upgradeGrid').innerHTML=list.map(([id,n,d])=>`<div class="upgrade"><h3>${n}</h3><div class="small">${d}</div><div style="margin:14px 0">Seviye <span class="level">${save.upgrades[id]}/5</span></div><button class="btn" onclick="buyUpgrade('${id}')">GELİŞTİR — ${money(400*(save.upgrades[id]+1))} ◆</button></div>`).join('')}
function openUpgrades(){hideAllScreens();$('upgrades').classList.remove('hidden');buildUpgradeUI()}
function buyUpgrade(id){const lv=save.upgrades[id];if(lv>=5){toast('Maksimum seviye');return}const cost=400*(lv+1);if(save.coins<cost){toast('Yeterli coin yok');return}save.coins-=cost;save.upgrades[id]++;persist();buildUpgradeUI();toast('Geliştirme uygulandı')}
function buildShopUI(){const items=[['pink','PINK NEON','Gövde rengi'],['gold','GOLD NEON','Gövde rengi'],['red','RED NEON','Gövde rengi']];$('shopList').innerHTML=items.map(([id,n,d])=>`<div class="shopItem"><div><b>${n}</b><div class="small">${d}</div></div><div>${save.skins[id]?'AÇIK':`<button class="btn" onclick="buySkin('${id}')">500 ◆</button>`}</div></div>`).join('')}
function openShop(){hideAllScreens();$('shop').classList.remove('hidden');buildShopUI()}
function buySkin(id){if(save.skins[id])return;if(save.coins<500){toast('Yeterli coin yok');return}save.coins-=500;save.skins[id]=true;persist();buildShopUI();buildGarageUI();toast('Renk açıldı')}
function buildStatsUI(){const s=[['EN İYİ SKOR',money(save.bestScore)],['TOPLAM COIN',money(save.coins)],['OYUN',money(save.games)],['MESAFE',save.distance.toFixed(2)+' KM'],['EN YÜKSEK HIZ',Math.round(save.bestSpeed)+' KM/H'],['EN İYİ COMBO',money(save.bestCombo)]];$('statsGrid').innerHTML=s.map(x=>`<div class="stat"><div class="small">${x[0]}</div><b>${x[1]}</b></div>`).join('')}
function openStats(){hideAllScreens();$('stats').classList.remove('hidden');buildStatsUI()}
function buildSettingsUI(){const s=save.settings;$('settingsContent').innerHTML=`<div class="setting"><label>MASTER SES <span id="volValue">${Math.round(s.volume*100)}%</span></label><input id="volumeRange" type="range" min="0" max="1" step=".05" value="${s.volume}" style="width:100%"></div><br><button class="btn wide" onclick="toggleSetting('effects')">EFEKTLER: ${s.effects?'AÇIK':'KAPALI'}</button><button class="btn wide" onclick="toggleSetting('music')">MÜZİK: ${s.music?'AÇIK':'KAPALI'}</button><button class="btn wide" onclick="toggleSetting('rain')">YAĞMUR: ${s.rain?'AÇIK':'KAPALI'}</button><button class="btn wide" onclick="toggleSetting('shake')">KAMERA SARSINTISI: ${s.shake?'AÇIK':'KAPALI'}</button><button class="btn danger wide" onclick="resetSave()">KAYDI SIFIRLA</button>`;$('volumeRange').oninput=e=>{save.settings.volume=+e.target.value;$('volValue').textContent=Math.round(save.settings.volume*100)+'%';persist();updateAudio()}}
function openSettings(inGame){if(inGame&&isPlaying){isPaused=true;$('pauseMenu').classList.add('hidden');$('hud').classList.add('hidden');$('touch').classList.add('hidden')}hideAllScreens();$('settings').classList.remove('hidden');buildSettingsUI()}
function closeSettings(){ $('settings').classList.add('hidden');if(isPlaying){$('hud').classList.remove('hidden');$('touch').classList.remove('hidden');$('pauseMenu').classList.remove('hidden');isPaused=true}else $('mainMenu').classList.remove('hidden')}
function toggleSetting(id){save.settings[id]=!save.settings[id];persist();buildSettingsUI();if(id==='rain')rainGroup.visible=save.settings.rain}
function resetSave(){if(!confirm('Kayıt tamamen silinsin mi?'))return;localStorage.removeItem(SAVE_KEY);save=loadSave();buildGarageUI();buildUpgradeUI();buildShopUI();buildStatsUI();buildSettingsUI();toast('Kayıt sıfırlandı')}

function setupInput(){document.querySelectorAll('.touchBtn').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();if(k==='left')keys.left=true;if(k==='right')keys.right=true;if(k==='nitro')keys.nitro=true};const up=e=>{e.preventDefault();if(k==='nitro')keys.nitro=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)})}
function startAudio(){if(!save.settings.music&&!save.settings.effects)return;if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();engineOsc=audioCtx.createOscillator();engineGain=audioCtx.createGain();engineOsc.type='sawtooth';engineOsc.frequency.value=70;engineGain.gain.value=0;engineOsc.connect(engineGain).connect(audioCtx.destination);engineOsc.start()}audioCtx.resume();updateAudio()}
function updateAudio(){if(!audioCtx||!engineGain)return;engineGain.gain.value=save.settings.music&&isPlaying&&!isPaused?Math.min(.035,save.settings.volume*.05):0;if(engineOsc)engineOsc.frequency.value=55+(speed*.45)}
function pauseAudio(){updateAudio()}function resumeAudio(){if(audioCtx)audioCtx.resume();updateAudio()}function stopAudio(){if(engineGain)engineGain.gain.value=0}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);resizeGarage()}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(isPlaying&&!isPaused&&!gameOver)updateGame(dt);if(save.settings.rain&&rainGroup)rainGroup.visible=true;if(!save.settings.rain&&rainGroup)rainGroup.visible=false;renderer.render(scene,camera);if(garageRenderer&&garageCar){const gd=Math.min(garageClock.getDelta(),.05);garageCar.rotation.y+=gd*.25;garageRenderer.render(garageScene,garageCamera)}}
window.addEventListener('load',initEngine);
</script>
</body>
</html>
