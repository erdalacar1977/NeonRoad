<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Neon Road 5.0 — AAA Cyberpunk Engine</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#010206;
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:white;
}

body{ touch-action:none; }

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.hidden{ display:none!important; }

/* HUD OVERLAY */
#hud{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.hud-top{
  position:absolute;
  top:20px;
  left:20px;
  right:20px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.hud-cluster{
  display:flex;
  gap:12px;
}

.stat-card{
  background:rgba(2,6,18,0.75);
  border:1px solid rgba(0,234,255,0.4);
  border-left:3px solid #00eaff;
  padding:8px 14px;
  backdrop-filter:blur(8px);
  box-shadow:0 0 15px rgba(0,234,255,0.15);
}

.stat-title{
  color:#6c829b;
  font-size:9px;
  letter-spacing:2px;
  font-weight:bold;
}

.stat-value{
  font-size:20px;
  font-weight:900;
  color:#ffffff;
  text-shadow:0 0 10px #00eaff;
  font-family:monospace;
}

.hud-controls{
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.btn-icon{
  width:44px;
  height:44px;
  background:rgba(2,6,18,0.8);
  border:1px solid rgba(0,234,255,0.5);
  color:#00eaff;
  font-size:18px;
  cursor:pointer;
  transition:0.2s;
}

.btn-icon:hover{
  background:rgba(0,234,255,0.2);
  box-shadow:0 0 15px #00eaff;
}

/* NITRO & TACHOMETER */
.gauge-container{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  width:min(420px,85vw);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.nitro-bar-outer{
  width:100%;
  height:12px;
  background:rgba(0,0,0,0.8);
  border:1px solid rgba(0,234,255,0.6);
  padding:2px;
  box-shadow:0 0 12px rgba(0,234,255,0.2);
}

#nitroFill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#00eaff,#0055ff,#ff0077);
  box-shadow:0 0 15px #00eaff;
  transition:width 0.1s linear;
}

.rpm-text{
  font-size:11px;
  letter-spacing:3px;
  color:#00eaff;
  font-weight:bold;
  text-shadow:0 0 8px #00eaff;
}

/* TOUCH CONTROLS */
#mobileControls{
  position:absolute;
  inset:0;
  z-index:12;
  pointer-events:none;
  display:flex;
  justify-content:space-between;
  padding:20px;
  align-items:flex-end;
}

.touch-zone{
  width:40vw;
  height:40vh;
  pointer-events:auto;
  display:flex;
  align-items:flex-end;
}

.touch-btn{
  width:80px;
  height:80px;
  border-radius:50%;
  background:rgba(0,234,255,0.08);
  border:2px solid rgba(0,234,255,0.4);
  color:#00eaff;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(4px);
}

.touch-btn:active{
  background:rgba(0,234,255,0.3);
  box-shadow:0 0 25px #00eaff;
}

.nitro-touch{
  border-color:#ff0077;
  color:#ff0077;
}

.nitro-touch:active{
  background:rgba(255,0,119,0.3);
  box-shadow:0 0 25px #ff0077;
}

/* MENUS & PANELS */
.overlay-panel{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at center, rgba(3,8,22,0.6), rgba(1,2,6,0.92));
  backdrop-filter:blur(12px);
}

.panel-card{
  width:min(520px,90vw);
  background:rgba(4,10,26,0.85);
  border:1px solid rgba(0,234,255,0.5);
  padding:35px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,234,255,0.2);
}

.title-glow{
  font-size:clamp(36px,8vw,64px);
  font-weight:900;
  font-style:italic;
  letter-spacing:6px;
  line-height:0.95;
  color:#ffffff;
  text-shadow:0 0 10px #fff, 0 0 20px #00eaff, 0 0 40px #00eaff;
}

.title-glow span{
  color:#ff0077;
  text-shadow:0 0 10px #ff0077, 0 0 30px #ff0077;
}

.sub-title{
  color:#5d7590;
  font-size:11px;
  letter-spacing:4px;
  margin-top:12px;
  margin-bottom:28px;
}

.menu-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn-primary{
  padding:14px;
  background:linear-gradient(90deg, rgba(0,234,255,0.2), rgba(0,100,255,0.2));
  border:1px solid #00eaff;
  color:white;
  font-weight:bold;
  font-size:15px;
  letter-spacing:3px;
  cursor:pointer;
  transition:0.2s;
}

.btn-primary:hover{
  background:linear-gradient(90deg, rgba(0,234,255,0.5), rgba(0,100,255,0.5));
  box-shadow:0 0 25px #00eaff;
}

.results-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0;
}

.result-box{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.1);
  padding:12px;
}

.result-box label{ font-size:9px; color:#5d7590; letter-spacing:2px; display:block; }
.result-box span{ font-size:22px; font-weight:bold; color:#00eaff; }
</style>
</head>
<body>

<div id="game"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-cluster">
      <div class="stat-card">
        <div class="stat-title">SKOR</div>
        <div class="stat-value" id="scoreVal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">KM/H</div>
        <div class="stat-value" id="speedVal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">COIN</div>
        <div class="stat-value" id="coinVal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">CAN</div>
        <div class="stat-value" id="healthVal">♥♥♥</div>
      </div>
    </div>
    <div class="hud-controls">
      <button class="btn-icon" onclick="togglePause()">Ⅱ</button>
    </div>
  </div>

  <div class="gauge-container">
    <div class="rpm-text" id="rpmText">NITRO BOOST - READY</div>
    <div class="nitro-bar-outer">
      <div id="nitroFill"></div>
    </div>
  </div>
</div>

<!-- TOUCH -->
<div id="mobileControls" class="hidden">
  <div class="touch-zone" id="touchLeft"><div class="touch-btn">◀</div></div>
  <div class="touch-zone" style="justify-content:flex-end;" id="touchRight"><div class="touch-btn">▶</div></div>
  <div class="touch-zone" style="position:absolute; bottom:120px; right:20px; width:auto; height:auto;" id="touchNitro">
    <div class="touch-btn nitro-touch">⚡</div>
  </div>
</div>

<!-- MAIN MENU -->
<div id="mainMenu" class="overlay-panel">
  <div class="panel-card">
    <div class="title-glow">NEON <span>ROAD</span></div>
    <div class="sub-title">VERSION 5.0 — AAA CYBERPUNK ENGINE</div>
    <div class="menu-actions">
      <button class="btn-primary" onclick="startGame()">▶ SÜRÜŞE BAŞLA</button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameOver" class="overlay-panel hidden">
  <div class="panel-card">
    <div class="title-glow">CRASHED</div>
    <div class="sub-title">SİMÜLASYON SONLANDI</div>
    <div class="results-grid">
      <div class="result-box"><label>SKOR</label><span id="resScore">0</span></div>
      <div class="result-box"><label>TOPLAM COIN</label><span id="resCoins">0</span></div>
      <div class="result-box"><label>MESAFE</label><span id="resDist">0m</span></div>
      <div class="result-box"><label>MAKS HIZ</label><span id="resSpeed">0</span></div>
    </div>
    <button class="btn-primary" onclick="startGame()">↻ YENİDEN BAŞLAT</button>
  </div>
</div>

<!-- THREE.JS & POST-PROCESSING ENGINE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* GLOBAL GAME ENGINE STATE */
const $ = id => document.getElementById(id);

let scene, camera, renderer, composer;
let audioCtx, engineOsc, engineGain, turboOsc;
let isPlaying = false, isPaused = false;

// Physics & Vehicle Parameters
const vehicle = {
  mesh: null,
  bodyMesh: null,
  x: 0,
  targetX: 0,
  lane: 1,
  lanes: [-5.2, 0, 5.2],
  speed: 0,
  targetSpeed: 0,
  maxSpeed: 240,
  nitro: 100,
  nitroActive: false,
  pitch: 0,
  roll: 0,
  health: 3,
  invulnerable: 0
};

let score = 0, coins = 0, distance = 0, maxAchievedSpeed = 0;
let traffic = [], coinsList = [], rainSystem, roadMesh, roadMaterial;
const clock = new THREE.Clock();

/* 1. SYNTHESIZED PROCEDURAL TEXTURES (PBR GENERATOR) */
function generateWetRoadTextures(){
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');

  // Base Wet Asphalt
  ctx.fillStyle = '#080a10';
  ctx.fillRect(0, 0, 512, 512);

  // Noise & Cracks
  for(let i=0; i<15000; i++){
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.2)';
    ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
  }

  // Puddles (Roughness Map Variant)
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  for(let i=0; i<8; i++){
    ctx.beginPath();
    ctx.arc(Math.random()*512, Math.random()*512, 30+Math.random()*50, 0, Math.PI*2);
    ctx.fill();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(1, 40);
  return texture;
}

/* 2. 3D AUDIO ENGINE (WEB AUDIO SYNTHESIZER) */
function initAudioEngine(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Engine Synthesizer (Low-Frequency Sawtooth + LowPass Filter)
  engineOsc = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  engineGain = audioCtx.createGain();

  engineOsc.type = 'sawtooth';
  engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);

  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(280, audioCtx.currentTime);

  engineGain.gain.setValueAtTime(0.001, audioCtx.currentTime);

  engineOsc.connect(filter);
  filter.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineOsc.start();
}

function updateEngineAudio(speedRatio, isNitro){
  if(!audioCtx || !engineOsc) return;
  const baseFreq = 40 + speedRatio * 160 + (isNitro ? 50 : 0);
  engineOsc.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.05);
  engineGain.gain.setTargetAtTime(isPlaying ? 0.2 : 0.001, audioCtx.currentTime, 0.1);
}

function playSoundFX(type){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if(type === 'coin'){
    osc.type = 'sine';
    osc.frequency.setValueAtTime(900, now);
    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.12);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
    osc.start(now); osc.stop(now + 0.12);
  }else if(type === 'crash'){
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.linearRampToValueAtTime(30, now + 0.35);
    gain.gain.setValueAtTime(0.6, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
    osc.start(now); osc.stop(now + 0.35);
  }
}

/* 3. SCENE, LIGHTING & POST-PROCESSING SETUP */
function initEngine(){
  const container = $('game');

  // Scene & Camera
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x010206);
  scene.fog = new THREE.FogExp2(0x010206, 0.007);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 4.5, 9);

  // WebGL Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  // Post-Processing Bloom Pipeline
  const renderPass = new THREE.RenderPass(scene, camera);
  const bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.4, // Strength
    0.4, // Radius
    0.85 // Threshold
  );

  composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderPass);
  composer.addPass(bloomPass);

  // Lighting
  const ambient = new THREE.AmbientLight(0xddeeff, 0.6);
  scene.add(ambient);

  const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
  mainLight.position.set(20, 50, 20);
  scene.add(mainLight);

  // Cyberpunk City Lights
  const cyanLight = new THREE.PointLight(0x00eaff, 15, 120);
  cyanLight.position.set(-15, 8, -50);
  scene.add(cyanLight);

  const pinkLight = new THREE.PointLight(0xff0077, 15, 120);
  pinkLight.position.set(15, 8, -100);
  scene.add(pinkLight);

  // Construct World Elements
  buildRoad();
  buildCyberCity();
  buildPlayerVehicle();
  buildTrafficPool();
  buildCoinsPool();
  buildRainSystem();

  // Listeners
  window.addEventListener('resize', onWindowResize);
  setupInputHandlers();

  // Render Loop
  animate();
}

/* 4. WORLD BUILDERS & PROCEDURAL MESHES */
function buildRoad(){
  const roadGeo = new THREE.PlaneGeometry(16, 1000);
  const roadTex = generateWetRoadTextures();

  roadMaterial = new THREE.MeshStandardMaterial({
    color: 0x0a0d14,
    roughness: 0.2,
    metalness: 0.8,
    map: roadTex
  });

  roadMesh = new THREE.Mesh(roadGeo, roadMaterial);
  roadMesh.rotation.x = -Math.PI / 2;
  roadMesh.position.z = -450;
  scene.add(roadMesh);

  // Glowing Neon Edge Rails
  for(let side of [-1, 1]){
    const railGeo = new THREE.BoxGeometry(0.2, 0.2, 1000);
    const railMat = new THREE.MeshBasicMaterial({ color: side === -1 ? 0x00eaff : 0xff0077 });
    const rail = new THREE.Mesh(railGeo, railMat);
    rail.position.set(side * 8, 0.1, -450);
    scene.add(rail);
  }
}

function buildCyberCity(){
  const buildingGeo = new THREE.BoxGeometry(1, 1, 1);

  for(let i=0; i<60; i++){
    const height = 20 + Math.random() * 70;
    const width = 8 + Math.random() * 14;
    const depth = 10 + Math.random() * 20;

    const mat = new THREE.MeshStandardMaterial({
      color: 0x030712,
      roughness: 0.9,
      metalness: 0.1
    });

    const b = new THREE.Mesh(buildingGeo, mat);
    b.scale.set(width, height, depth);

    const side = i % 2 === 0 ? -1 : 1;
    b.position.set(side * (18 + Math.random() * 30), height / 2, -i * 18);
    scene.add(b);

    // Neon Window Emissives
    if(Math.random() > 0.3){
      const winGeo = new THREE.PlaneGeometry(width * 0.8, height * 0.7);
      const winMat = new THREE.MeshBasicMaterial({
        color: Math.random() > 0.5 ? 0x00eaff : 0xff0077,
        wireframe: true
      });
      const win = new THREE.Mesh(winGeo, winMat);
      win.position.set(side * (18 + Math.random() * 30), height / 2, -i * 18 + (side * depth/2 + 0.1));
      scene.add(win);
    }
  }
}

function buildPlayerVehicle(){
  vehicle.mesh = new THREE.Group();

  // Aerodynamic Body
  const bodyGeo = new THREE.BoxGeometry(2, 0.6, 4.2);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x00eaff,
    metalness: 0.9,
    roughness: 0.1
  });
  vehicle.bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  vehicle.bodyMesh.position.y = 0.5;
  vehicle.mesh.add(vehicle.bodyMesh);

  // Cabin
  const cabinGeo = new THREE.BoxGeometry(1.4, 0.5, 1.8);
  const cabinMat = new THREE.MeshStandardMaterial({ color: 0x02050a, roughness: 0.0, metalness: 1.0 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0, 0.85, -0.2);
  vehicle.mesh.add(cabin);

  // Underglow Neon
  const glowGeo = new THREE.PlaneGeometry(2.2, 4.4);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x00eaff, side: THREE.DoubleSide });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.rotation.x = Math.PI/2;
  glow.position.y = 0.05;
  vehicle.mesh.add(glow);

  scene.add(vehicle.mesh);
}

function buildTrafficPool(){
  for(let i=0; i<8; i++){
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(2, 0.8, 4),
      new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3, metalness: 0.7 })
    );
    mesh.position.y = 0.5;
    group.add(mesh);

    group.position.set(vehicle.lanes[i % 3], 0, -100 - i * 60);
    group.userData = { speed: 40 + Math.random() * 30 };
    scene.add(group);
    traffic.push(group);
  }
}

function buildCoinsPool(){
  const geo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16);
  const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });

  for(let i=0; i<15; i++){
    const coin = new THREE.Mesh(geo, mat);
    coin.rotation.x = Math.PI / 2;
    coin.position.set(vehicle.lanes[Math.floor(Math.random()*3)], 0.6, -80 - i * 35);
    scene.add(coin);
    coinsList.push(coin);
  }
}

function buildRainSystem(){
  const count = 1200;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);

  for(let i=0; i<count*3; i+=3){
    positions[i] = (Math.random() - 0.5) * 40;
    positions[i+1] = Math.random() * 25;
    positions[i+2] = (Math.random() - 0.5) * 80;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({ color: 0x00eaff, size: 0.1, transparent: true, opacity: 0.6 });
  rainSystem = new THREE.Points(geometry, material);
  scene.add(rainSystem);
}

/* 5. CONTROLS & INPUTS */
function setupInputHandlers(){
  window.addEventListener('keydown', e => {
    if(!isPlaying || isPaused) return;
    if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeLane(-1);
    if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeLane(1);
    if(e.key === ' ' || e.key === 'Shift') triggerNitro(true);
  });

  window.addEventListener('keyup', e => {
    if(e.key === ' ' || e.key === 'Shift') triggerNitro(false);
  });

  // Touch handlers
  $('touchLeft').addEventListener('touchstart', e => { e.preventDefault(); changeLane(-1); });
  $('touchRight').addEventListener('touchstart', e => { e.preventDefault(); changeLane(1); });
  $('touchNitro').addEventListener('touchstart', e => { e.preventDefault(); triggerNitro(true); });
  $('touchNitro').addEventListener('touchend', e => { e.preventDefault(); triggerNitro(false); });
}

function changeLane(dir){
  vehicle.lane = Math.max(0, Math.min(2, vehicle.lane + dir));
  vehicle.targetX = vehicle.lanes[vehicle.lane];
  // Haptic feedback for mobile
  if(navigator.vibrate) navigator.vibrate(25);
}

function triggerNitro(val){
  vehicle.nitroActive = val && vehicle.nitro > 5;
}

/* 6. GAME ENGINE LOOP & PHYSICS SIMULATION */
function animate(){
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if(isPlaying && !isPaused){
    // Speed Physics & G-Force Simulation
    const targetSpd = vehicle.nitroActive ? vehicle.maxSpeed * 1.3 : vehicle.maxSpeed;
    vehicle.speed += (targetSpd - vehicle.speed) * delta * 1.2;

    const speedRatio = vehicle.speed / vehicle.maxSpeed;
    if(vehicle.speed > maxAchievedSpeed) maxAchievedSpeed = Math.floor(vehicle.speed);

    // Nitro Consumption
    if(vehicle.nitroActive){
      vehicle.nitro = Math.max(0, vehicle.nitro - delta * 25);
      if(vehicle.nitro === 0) vehicle.nitroActive = false;
    }else{
      vehicle.nitro = Math.min(100, vehicle.nitro + delta * 10);
    }

    // Vehicle Steering Physics & Suspension Roll
    const dx = vehicle.targetX - vehicle.x;
    vehicle.x += dx * delta * 8;
    vehicle.roll = -dx * 0.08; // Roll suspension on lane turn
    vehicle.pitch = vehicle.nitroActive ? -0.05 : 0.02; // Pitch back on nitro acceleration

    vehicle.mesh.position.x = vehicle.x;
    vehicle.bodyMesh.rotation.z = vehicle.roll;
    vehicle.bodyMesh.rotation.x = vehicle.pitch;

    // Road Texture Scrolling (Speed Illusion)
    roadMaterial.map.offset.y -= delta * speedRatio * 8;

    // Traffic Motion & Collision Box Physics
    traffic.forEach(t => {
      t.position.z += delta * (vehicle.speed * 0.3 - t.userData.speed);
      if(t.position.z > 10){
        t.position.z = -250 - Math.random() * 150;
        t.position.x = vehicle.lanes[Math.floor(Math.random()*3)];
      }

      // Box Collision Check
      if(vehicle.invulnerable <= 0 && Math.abs(t.position.z - vehicle.mesh.position.z) < 3.2 && Math.abs(t.position.x - vehicle.x) < 1.6){
        handleCrash();
      }
    });

    // Coins Motion & Pickup
    coinsList.forEach(c => {
      c.rotation.z += delta * 3;
      c.position.z += delta * (vehicle.speed * 0.3);

      if(Math.abs(c.position.z - vehicle.mesh.position.z) < 2.2 && Math.abs(c.position.x - vehicle.x) < 1.4){
        coins += 10;
        score += 100;
        playSoundFX('coin');
        c.position.z = -200 - Math.random() * 100;
        c.position.x = vehicle.lanes[Math.floor(Math.random()*3)];
      }else if(c.position.z > 10){
        c.position.z = -200 - Math.random() * 100;
        c.position.x = vehicle.lanes[Math.floor(Math.random()*3)];
      }
    });

    // Invulnerability Flicker
    if(vehicle.invulnerable > 0){
      vehicle.invulnerable -= delta;
      vehicle.mesh.visible = Math.floor(clock.getElapsedTime() * 15) % 2 === 0;
    }else{
      vehicle.mesh.visible = true;
    }

    // Rain Motion
    const pos = rainSystem.geometry.attributes.position.array;
    for(let i=1; i<pos.length; i+=3){
      pos[i] -= delta * 40;
      if(pos[i] < 0) pos[i] = 25;
    }
    rainSystem.geometry.attributes.position.needsUpdate = true;

    // Dynamic Camera Tracking & Shake Effect
    camera.position.x = vehicle.x * 0.35;
    camera.fov = 60 + speedRatio * 15; // Speed FOV expansion
    camera.updateProjectionMatrix();

    // Stats & Audio
    distance += delta * vehicle.speed * 0.2;
    score += Math.floor(delta * vehicle.speed);
    updateEngineAudio(speedRatio, vehicle.nitroActive);
    updateHUD();
  }

  composer.render();
}

function handleCrash(){
  playSoundFX('crash');
  vehicle.health--;
  vehicle.invulnerable = 2.0;
  if(navigator.vibrate) navigator.vibrate([100, 50, 100]);

  if(vehicle.health <= 0){
    endGame();
  }
}

/* 7. STATE & UI MANAGERS */
function startGame(){
  initAudioEngine();

  vehicle.x = 0;
  vehicle.targetX = 0;
  vehicle.lane = 1;
  vehicle.speed = 0;
  vehicle.nitro = 100;
  vehicle.health = 3;
  vehicle.invulnerable = 0;

  score = 0; coins = 0; distance = 0; maxAchievedSpeed = 0;
  isPlaying = true; isPaused = false;

  $('mainMenu').classList.add('hidden');
  $('gameOver').classList.add('hidden');
  $('hud').classList.remove('hidden');
  if('ontouchstart' in window) $('mobileControls').classList.remove('hidden');
}

function endGame(){
  isPlaying = false;
  $('hud').classList.add('hidden');
  $('mobileControls').classList.add('hidden');

  $('resScore').innerText = score;
  $('resCoins').innerText = coins;
  $('resDist').innerText = Math.floor(distance) + 'm';
  $('resSpeed').innerText = maxAchievedSpeed + ' KM/H';

  $('gameOver').classList.remove('hidden');
}

function togglePause(){
  isPaused = !isPaused;
}

function updateHUD(){
  $('scoreVal').innerText = score;
  $('speedVal').innerText = Math.floor(vehicle.speed);
  $('coinVal').innerText = coins;
  $('healthVal').innerText = '♥'.repeat(Math.max(0, vehicle.health));
  $('nitroFill').style.width = vehicle.nitro + '%';
}

function onWindowResize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}

// Launch Engine on Load
window.onload = initEngine;
</script>
