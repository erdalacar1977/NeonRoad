<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Road 3.0</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}
canvas{
    display:block;
    width:100vw;
    height:100vh;
}
#hud{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    width:min(1100px,94vw);
    display:flex;
    justify-content:space-between;
    gap:8px;
    z-index:5;
    pointer-events:none;
}
.box{
    min-width:110px;
    padding:9px 14px;
    border:1px solid #36f7ff66;
    border-radius:13px;
    background:#020713bb;
    box-shadow:0 0 20px #00eaff22;
    backdrop-filter:blur(8px);
    text-align:center;
}
.box small{
    display:block;
    font-size:10px;
    opacity:.55;
    letter-spacing:2px;
}
.box b{
    font-size:19px;
}
#nitroWrap{
    position:fixed;
    left:50%;
    top:78px;
    transform:translateX(-50%);
    width:min(360px,65vw);
    height:10px;
    border:1px solid #fff5;
    border-radius:20px;
    background:#000b;
    overflow:hidden;
    z-index:5;
}
#nitro{
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#00eaff,#6d5cff,#ff2eea);
    box-shadow:0 0 18px #00eaff;
    transition:width .08s linear;
}
#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:grid;
    place-items:center;
    background:
        radial-gradient(circle at 50% 40%,#15205ccc,#02040af5 65%);
}
.card{
    width:min(560px,90vw);
    padding:38px;
    border:1px solid #36f7ff55;
    border-radius:28px;
    background:#060b18dd;
    box-shadow:0 0 80px #00eaff22,0 25px 100px #000;
    text-align:center;
    backdrop-filter:blur(15px);
}
.logo{
    font-size:clamp(42px,9vw,76px);
    font-weight:900;
    letter-spacing:8px;
    margin-bottom:4px;
    color:#fff;
    text-shadow:
        0 0 8px #00eaff,
        0 0 25px #00eaff,
        0 0 55px #ff2eea;
}
.sub{
    letter-spacing:5px;
    color:#00eaff;
    font-size:12px;
    margin-bottom:28px;
}
.card p{
    color:#aab5ce;
    line-height:1.7;
}
button{
    border:0;
    cursor:pointer;
    color:white;
    font-weight:bold;
}
.start{
    margin-top:15px;
    padding:16px 30px;
    border-radius:14px;
    font-size:17px;
    letter-spacing:2px;
    background:linear-gradient(90deg,#00d9ff,#765cff,#ff2eea);
    box-shadow:0 0 30px #00eaff55;
}
.start:active{
    transform:scale(.96);
}
.help{
    margin-top:22px;
    font-size:12px;
    opacity:.55;
}
#mobile{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    z-index:10;
}
.mbtn{
    width:70px;
    height:62px;
    border-radius:17px;
    background:#030712bb;
    border:1px solid #36f7ff66;
    box-shadow:0 0 20px #00eaff22;
    font-size:24px;
}
.mbtn.nitro{
    width:100px;
    color:#ffe45c;
    border-color:#ffe45c77;
}
#flash{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:white;
    opacity:0;
    z-index:30;
}
@media(max-width:600px){
    #hud{top:8px}
    .box{
        min-width:0;
        padding:7px 8px;
    }
    .box small{font-size:8px}
    .box b{font-size:14px}
    #nitroWrap{top:58px}
    .card{padding:28px 20px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="box">
        <small>SKOR</small>
        <b id="score">0</b>
    </div>

    <div class="box">
        <small>COIN</small>
        <b id="coins">0</b>
    </div>

    <div class="box">
        <small>COMBO</small>
        <b id="combo">x1</b>
    </div>

    <div class="box">
        <small>CAN</small>
        <b id="lives">♥♥♥</b>
    </div>

    <div class="box">
        <small>EN İYİ</small>
        <b id="best">0</b>
    </div>
</div>

<div id="nitroWrap">
    <div id="nitro"></div>
</div>

<div id="flash"></div>

<div id="menu">
    <div class="card" id="card">

        <div class="logo">NEON ROAD</div>
        <div class="sub">NIGHT DRIVE // 3.0</div>

        <p>
            Şehrin neon ışıkları altında<br>
            trafiğin arasından sıyrıl.
        </p>

        <p>
            <b>← →</b> / <b>A D</b> : Şerit değiştir<br>
            <b>SPACE</b> : Nitro
        </p>

        <button class="start" id="start">
            YARIŞI BAŞLAT
        </button>

        <div class="help">
            Coin topla • Trafikten kaç • Rekorunu kır
        </div>

    </div>
</div>

<div id="mobile">
    <button class="mbtn" id="left">◀</button>
    <button class="mbtn nitro" id="boost">⚡ NİTRO</button>
    <button class="mbtn" id="right">▶</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let dpr=Math.min(devicePixelRatio||1,2);

function resize(){
    W=innerWidth;
    H=innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

const scoreEl=document.getElementById("score");
const coinsEl=document.getElementById("coins");
const comboEl=document.getElementById("combo");
const livesEl=document.getElementById("lives");
const bestEl=document.getElementById("best");
const nitroEl=document.getElementById("nitro");
const menu=document.getElementById("menu");
const card=document.getElementById("card");
const flash=document.getElementById("flash");

let running=false;
let last=0;

let score=0;
let coins=0;
let combo=1;
let comboTimer=0;
let nitro=100;
let lives=3;

let distance=0;
let spawnTimer=0;
let coinTimer=0;
let shake=0;

let best=Number(localStorage.getItem("neonRoadBest")||0);

bestEl.textContent=best;

const keys={};

const player={
    lane:1,
    x:0,
    y:0,
    targetX:0,
    w:42,
    h:78
};

let cars=[];
let coinList=[];
let particles=[];
let rain=[];

for(let i=0;i<130;i++){
    rain.push({
        x:Math.random(),
        y:Math.random(),
        s:.4+Math.random()*1.2
    });
}

function road(){
    return {
        topW:Math.min(W*.22,260),
        bottomW:Math.min(W*.72,720),
        center:W/2,
        horizon:H*.31,
        bottom:H
    };
}

function laneX(lane,depth){
    const r=road();

    const t=Math.max(0,Math.min(1,depth));

    const width=r.topW+(r.bottomW-r.topW)*t;
    const left=r.center-width/2;

    return left+width*((lane+.5)/3);
}

function playerY(){
    return H*.78;
}

function reset(){
    score=0;
    coins=0;
    combo=1;
    comboTimer=0;
    nitro=100;
    lives=3;
    distance=0;
    spawnTimer=.4;
    coinTimer=.8;
    shake=0;

    cars=[];
    coinList=[];
    particles=[];

    player.lane=1;
    player.y=playerY();
    player.x=laneX(1,1);
    player.targetX=player.x;

    updateHud();
}

function startGame(){
    reset();

    running=true;
    menu.style.display="none";

    last=performance.now();

    requestAnimationFrame(loop);
}

function gameOver(){
    running=false;

    if(Math.floor(score)>best){
        best=Math.floor(score);
        localStorage.setItem("neonRoadBest",best);
    }

    updateHud();

    card.innerHTML=`
        <div class="logo" style="font-size:45px">GAME OVER</div>
        <div class="sub">NIGHT DRIVE</div>

        <p>
        Skor<br>
        <b style="font-size:30px;color:#00eaff">
        ${Math.floor(score)}
        </b>
        </p>

        <p>
        🪙 ${coins} COIN<br>
        🏆 EN İYİ: ${best}
        </p>

        <button class="start" id="again">
            TEKRAR OYNA
        </button>
    `;

    menu.style.display="grid";

    document.getElementById("again").onclick=startGame;
}

function updateHud(){
    scoreEl.textContent=Math.floor(score);
    coinsEl.textContent=coins;
    comboEl.textContent="x"+combo;

    livesEl.textContent=
        "♥".repeat(lives)+
        "♡".repeat(3-lives);

    bestEl.textContent=best;

    nitroEl.style.width=Math.max(0,nitro)+"%";
}

function move(dir){
    if(!running)return;

    player.lane=Math.max(
        0,
        Math.min(2,player.lane+dir)
    );

    player.targetX=laneX(player.lane,1);
}

function currentSpeed(){
    let base=360+Math.min(distance*.025,260);

    if(keys.Space&&nitro>0){
        return base+250;
    }

    return base;
}

function spawnCar(){

    const lane=Math.floor(Math.random()*3);

    const colors=[
        "#ff365d",
        "#7c5cff",
        "#00d9ff",
        "#ff9f43",
        "#e6ff45",
        "#ff2eea"
    ];

    cars.push({
        lane,
        depth:0,
        speed:.45+Math.random()*.35,
        color:colors[Math.floor(Math.random()*colors.length)],
        w:38+Math.random()*8,
        h:70+Math.random()*15
    });
}

function spawnCoin(){

    coinList.push({
        lane:Math.floor(Math.random()*3),
        depth:0,
        spin:Math.random()*6
    });
}

function createExplosion(x,y,color="#00eaff"){

    for(let i=0;i<28;i++){

        const a=Math.random()*Math.PI*2;
        const s=80+Math.random()*260;

        particles.push({
            x,
            y,
            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,
            life:.5+Math.random()*.6,
            size:2+Math.random()*5,
            color
        });
    }
}

function collision(a,b){

    return Math.abs(a.x-b.x)<35 &&
           Math.abs(a.y-b.y)<55;
}

function hitPlayer(){

    lives--;

    shake=18;

    createExplosion(
        player.x,
        player.y,
        "#ff365d"
    );

    flash.style.opacity=".8";

    setTimeout(()=>{
        flash.style.opacity="0";
    },70);

    if(lives<=0){
        gameOver();
    }
}

function update(dt){

    const speed=currentSpeed();

    distance+=speed*dt;

    score+=speed*dt*.09*combo;

    if(comboTimer>0){
        comboTimer-=dt;

        if(comboTimer<=0){
            combo=1;
        }
    }

    if(keys.Space&&nitro>0){

        nitro-=38*dt;

        if(nitro<0)nitro=0;

        if(Math.random()<.45){

            particles.push({
                x:player.x+(Math.random()-.5)*20,
                y:player.y+45,
                vx:(Math.random()-.5)*35,
                vy:100+Math.random()*100,
                life:.25,
                size:3+Math.random()*5,
                color:"#ffe45c"
            });
        }

    }else{
        nitro=Math.min(100,nitro+7*dt);
    }

    player.x+=(player.targetX-player.x)*
              Math.min(1,dt*10);

    spawnTimer-=dt;
    coinTimer-=dt;

    if(spawnTimer<=0){

        spawnCar();

        spawnTimer=
            Math.max(
                .28,
                .75-distance/35000
            );
    }

    if(coinTimer<=0){

        spawnCoin();

        coinTimer=.45+Math.random()*.65;
    }

    for(let i=cars.length-1;i>=0;i--){

        const car=cars[i];

        car.depth+=
            (speed*car.speed/600)*dt;

        const x=laneX(car.lane,car.depth);
        const y=
            road().horizon+
            (H-road().horizon)*car.depth;

        if(
            car.depth>.78 &&
            car.depth<1.08
        ){

            if(
                Math.abs(player.x-x)<38
            ){

                cars.splice(i,1);

                hitPlayer();

                continue;
            }
        }

        if(car.depth>1.1){
            cars.splice(i,1);
        }
    }

    for(let i=coinList.length-1;i>=0;i--){

        const coin=coinList[i];

        coin.depth+=speed/650*dt;

        const x=laneX(coin.lane,coin.depth);

        const y=
            road().horizon+
            (H-road().horizon)*coin.depth;

        if(
            coin.depth>.78 &&
            Math.abs(player.x-x)<30
        ){

            coins++;

            score+=250*combo;

            combo=Math.min(8,combo+1);

            comboTimer=2.2;

            nitro=Math.min(100,nitro+12);

            createExplosion(
                x,
                y,
                "#ffe45c"
            );

            coinList.splice(i,1);

            continue;
        }

        if(coin.depth>1.1){
            coinList.splice(i,1);
        }
    }

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vy+=180*dt;

        p.life-=dt;

        if(p.life<=0){
            particles.splice(i,1);
        }
    }

    if(shake>0){
        shake-=60*dt;
        if(shake<0)shake=0;
    }

    updateHud();
}

function drawCity(){

    const r=road();

    ctx.fillStyle="#050817";
    ctx.fillRect(0,0,W,H);

    const sky=
        ctx.createLinearGradient(
            0,0,0,H
        );

    sky.addColorStop(0,"#03051a");
    sky.addColorStop(.45,"#101342");
    sky.addColorStop(1,"#08131d");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    const horizon=r.horizon;

    for(let side=0;side<2;side++){

        for(let i=0;i<16;i++){

            const bw=30+Math.random()*45;
            const bh=60+Math.random()*160;

            let x;

            if(side===0){
                x=i*(W/16)-20;
            }else{
                x=W-i*(W/16)-bw+20;
            }

            ctx.fillStyle=
                i%2?
                "#0a1020":
                "#0c1529";

            ctx.fillRect(
                x,
                horizon-bh,
                bw,
                bh
            );

            ctx.fillStyle=
                i%2?
                "#00eaff66":
                "#ff2eea66";

            for(let y=horizon-bh+15;y<horizon-10;y+=22){

                if(Math.random()>.35){

                    ctx.fillRect(
                        x+7,
                        y,
                        5,
                        8
                    );
                }
            }
        }
    }

    ctx.fillStyle="#071017";
    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );
}

function drawRoad(){

    const r=road();

    const top=r.topW;
    const bottom=r.bottomW;
    const h=r.horizon;

    ctx.beginPath();

    ctx.moveTo(
        r.center-top/2,
        h
    );

    ctx.lineTo(
        r.center+top/2,
        h
    );

    ctx.lineTo(
        r.center+bottom/2,
        H
    );

    ctx.lineTo(
        r.center-bottom/2,
        H
    );

    ctx.closePath();

    const roadGrad=
        ctx.createLinearGradient(
            0,h,0,H
        );

    roadGrad.addColorStop(0,"#141927");
    roadGrad.addColorStop(.5,"#090d17");
    roadGrad.addColorStop(1,"#111722");

    ctx.fillStyle=roadGrad;
    ctx.fill();

    ctx.save();

    ctx.strokeStyle="#00eaff";
    ctx.shadowBlur=20;
    ctx.shadowColor="#00eaff";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        r.center-top/2,
        h
    );

    ctx.lineTo(
        r.center-bottom/2,
        H
    );

    ctx.stroke();

    ctx.strokeStyle="#ff2eea";

    ctx.beginPath();

    ctx.moveTo(
        r.center+top/2,
        h
    );

    ctx.lineTo(
        r.center+bottom/2,
        H
    );

    ctx.stroke();

    ctx.restore();

    const offset=(distance*.7)%90;

    for(let lane=1;lane<3;lane++){

        for(let i=0;i<14;i++){

            let z=(i/14+.02+offset/900)%1;

            let y=
                h+(H-h)*z;

            let width=
                top+(bottom-top)*z;

            let x1=
                r.center-width/2+
                width*(lane/3);

            let lineH=
                8+z*30;

            ctx.fillStyle="#ffffffaa";

            ctx.fillRect(
                x1-2,
                y,
                4,
                lineH
            );
        }
    }
}

function drawCar(x,y,w,h,color){

    ctx.save();

    ctx.translate(x,y);

    ctx.shadowBlur=25;
    ctx.shadowColor=color;

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.roundRect(
        -w/2,
        -h/2,
        w,
        h,
        w*.22
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="#07101d";

    ctx.beginPath();

    ctx.roundRect(
        -w*.3,
        -h*.28,
        w*.6,
        h*.25,
        5
    );

    ctx.fill();

    ctx.fillStyle="#0a0d12";

    ctx.fillRect(
        -w*.62,
        -h*.2,
        w*.18,
        h*.22
    );

    ctx.fillRect(
        w*.44,
        -h*.2,
        w*.18,
        h*.22
    );

    ctx.fillRect(
        -w*.62,
        h*.05,
        w*.18,
        h*.22
    );

    ctx.fillRect(
        w*.44,
        h*.05,
        w*.18,
        h*.22
    );

    ctx.fillStyle="#ff304f";

    ctx.fillRect(
        -w*.32,
        h*.28,
        w*.18,
        h*.08
    );

    ctx.fillRect(
        w*.14,
        h*.28,
        w*.18,
        h*.08
    );

    ctx.restore();
}

function drawPlayer(){

    drawCar(
        player.x,
        player.y,
        player.w,
        player.h,
        "#00eaff"
    );

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.fillStyle="#ffffff";

    ctx.shadowBlur=15;
    ctx.shadowColor="#00eaff";

    ctx.fillRect(
        -13,
        -18,
        26,
        7
    );

    ctx.restore();

    if(keys.Space&&nitro>0){

        ctx.save();

        ctx.translate(
            player.x,
            player.y+42
        );

        ctx.shadowBlur=25;
        ctx.shadowColor="#ffe45c";

        const g=
            ctx.createLinearGradient(
                0,0,0,55
            );

        g.addColorStop(0,"#ffffff");
        g.addColorStop(.3,"#ffe45c");
        g.addColorStop(1,"transparent");

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.moveTo(-12,0);
        ctx.lineTo(0,60+Math.random()*20);
        ctx.lineTo(12,0);

        ctx.closePath();

        ctx.fill();

        ctx.restore();
    }
}

function drawCoins(){

    for(const coin of coinList){

        const x=
            laneX(coin.lane,coin.depth);

        const y=
            road().horizon+
            (H-road().horizon)*coin.depth;

        const size=
            4+coin.depth*11;

        ctx.save();

        ctx.translate(x,y);

        ctx.rotate(
            performance.now()/180+
            coin.spin
        );

        ctx.fillStyle="#ffe45c";
        ctx.shadowBlur=20;
        ctx.shadowColor="#ffe45c";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}

function drawRain(){

    ctx.strokeStyle="#ffffff25";
    ctx.lineWidth=1;

    for(const r of rain){

        let x=r.x*W;
        let y=r.y*H;

        ctx.beginPath();

        ctx.moveTo(x,y);

        ctx.lineTo(
            x-10*r.s,
            y+30*r.s
        );

        ctx.stroke();

        r.y+=.008*r.s;

        if(r.y>1){
            r.y=0;
            r.x=Math.random();
        }
    }
}

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(0,p.life);

        ctx.fillStyle=p.color;

        ctx.shadowBlur=12;
        ctx.shadowColor=p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
}

function drawSpeedLines(){

    if(!(keys.Space&&nitro>0))return;

    ctx.strokeStyle="#ffffff25";

    for(let i=0;i<20;i++){

        let x=Math.random()*W;
        let y=Math.random()*H;

        ctx.beginPath();

        ctx.moveTo(x,y);

        ctx.lineTo(
            x,
            y+40+Math.random()*100
        );

        ctx.stroke();
    }
}

function draw(){

    ctx.save();

    if(shake>0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );
    }

    drawCity();
    drawRoad();

    for(const car of cars){

        const x=
            laneX(car.lane,car.depth);

        const y=
            road().horizon+
            (H-road().horizon)*car.depth;

        const scale=
            .35+car.depth*.85;

        drawCar(
            x,
            y,
            car.w*scale,
            car.h*scale,
            car.color
        );
    }

    drawCoins();
    drawPlayer();
    drawParticles();
    drawRain();
    drawSpeedLines();

    ctx.restore();
}

function loop(t){

    if(!running)return;

    const dt=
        Math.min(
            .035,
            (t-last)/1000
        );

    last=t;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

function audioBeep(freq=440,duration=.08,type="sine"){

    try{

        const AudioContext=
            window.AudioContext||
            window.webkitAudioContext;

        if(!window.audio){
            window.audio=new AudioContext();
        }

        const ac=window.audio;

        const osc=ac.createOscillator();
        const gain=ac.createGain();

        osc.type=type;
        osc.frequency.value=freq;

        gain.gain.setValueAtTime(
            .05,
            ac.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            ac.currentTime+duration
        );

        osc.connect(gain);
        gain.connect(ac.destination);

        osc.start();
        osc.stop(
            ac.currentTime+duration
        );

    }catch(e){}
}

document.getElementById("start").onclick=()=>{
    audioBeep(520,.12);
    startGame();
};

document.getElementById("left").onpointerdown=()=>{
    audioBeep(260,.05);
    move(-1);
};

document.getElementById("right").onpointerdown=()=>{
    audioBeep(330,.05);
    move(1);
};

const boost=document.getElementById("boost");

boost.onpointerdown=()=>{
    keys.Space=true;
    audioBeep(700,.08,"sawtooth");
};

boost.onpointerup=()=>{
    keys.Space=false;
};

boost.onpointercancel=()=>{
    keys.Space=false;
};

addEventListener("keydown",e=>{

    keys[e.code]=true;

    if(
        e.code==="ArrowLeft"||
        e.code==="KeyA"
    ){
        move(-1);
    }

    if(
        e.code==="ArrowRight"||
        e.code==="KeyD"
    ){
        move(1);
    }

    if(e.code==="Space"){
        e.preventDefault();
    }
});

addEventListener("keyup",e=>{
    keys[e.code]=false;
});

canvas.addEventListener("pointerdown",()=>{
    if(running){
        audioBeep(180,.03);
    }
});

player.y=playerY();
player.x=laneX(1,1);
player.targetX=player.x;

draw();
</script>

</html>
