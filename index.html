<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Road</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#fff;font-family:Arial;overflow:hidden}canvas{display:block;margin:auto;max-width:100vw;max-height:100vh;background:#111;box-shadow:0 0 50px #000}#hud{position:fixed;top:15px;left:50%;transform:translateX(-50%);width:min(850px,94vw);display:flex;justify-content:space-between;gap:8px;pointer-events:none}.p{background:#000a;border:1px solid #fff3;border-radius:12px;padding:8px 12px;font-weight:bold}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#0009}.card{width:min(500px,90vw);padding:32px;text-align:center;border-radius:22px;background:#101827ee;border:1px solid #fff3;box-shadow:0 20px 70px #000}h1{font-size:46px;letter-spacing:4px;margin:0 0 8px}button{border:0;border-radius:12px;padding:13px 22px;font-weight:bold;font-size:16px;background:#19e6a2;cursor:pointer}.ctrls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}.ctrl{width:62px;height:58px;background:#000b;color:#fff;border:1px solid #fff3}.nit{background:#ffd34d;color:#111}</style></head><body><canvas id="c" width="900" height="600"></canvas><div id="hud"><div class="p">🏁 <span id="s">0</span></div><div class="p">💰 <span id="co">0</span></div><div class="p">⚡ <span id="n">100</span>%</div><div class="p">🏎️ <span id="sp">0</span></div></div><div id="menu"><div class="card" id="card"><h1>NEON ROAD</h1><p>Tarayıcıda çalışan mini yarış oyunu.</p><p>← → veya A/D: şerit değiştir<br>SPACE: nitro<br>Engellerden kaç, coin topla.</p><button id="start">YARIŞI BAŞLAT</button><p style="opacity:.55;font-size:13px">Tek HTML dosyası • Harici kütüphane yok • GitHub Pages uyumlu</p></div></div><div class="ctrls"><button class="ctrl" id="l">◀</button><button class="ctrl nit" id="b">⚡</button><button class="ctrl" id="r">▶</button></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=900,H=600,road={x:230,w:440},lanes=[303,450,597];let run=0,score=0,coins=0,nitro=100,d=0,last=0,timer=0,obs=[],cs=[],keys={};let p={x:450,y:490,w:48,h:82,lane:1,target:450};
function reset(){score=coins=0;nitro=100;d=timer=0;obs=[];cs=[];p.lane=1;p.x=p.target=450;hud()}function startGame(){reset();run=1;;document.getElementById('menu').style.display='none';last=performance.now();requestAnimationFrame(loop)}function over(){run=0;document.getElementById('menu').style.display='grid';document.getElementById('card').innerHTML='<h1>YARIŞ BİTTİ</h1><p>Skor: <b>'+Math.floor(score)+'</b></p><p>Coin: <b>'+coins+'</b></p><button onclick="location.reload()">TEKRAR OYNA</button>'}function move(q){if(run){p.lane=Math.max(0,Math.min(2,p.lane+q));p.target=lanes[p.lane]}}function speed(){return 260+Math.min(d/80,220)+(keys.Space&&nitro>0?170:0)}function hud(){s.textContent=Math.floor(score);co.textContent=coins;n.textContent=Math.floor(nitro);sp.textContent=Math.floor(180+Math.min(d/30,180))}function hit(a,b){return Math.abs(a.x-b.x)<35&&Math.abs(a.y-b.y)<55}function spawn(){let z=Math.floor(Math.random()*3);obs.push({x:lanes[z],y:-100,w:48,h:82,v:40+Math.random()*100});if(Math.random()<.7)cs.push({x:lanes[Math.floor(Math.random()*3)],y:-30,r:10});timer=Math.max(.35,.85-d/18000)}function update(dt){let v=speed();d+=v*dt;timer-=dt;if(timer<0)spawn();p.x+=(p.target-p.x)*Math.min(1,dt*12);obs.forEach(o=>o.y+=(v+o.v)*dt);cs.forEach(o=>o.y+=v*dt);for(let i=obs.length-1;i>=0;i--){if(obs[i].y>680)obs.splice(i,1);else if(hit(p,obs[i]))return over()}for(let i=cs.length-1;i>=0;i--){let q=cs[i];if(Math.hypot(q.x-p.x,q.y-p.y)<28){coins++;score+=150;nitro=Math.min(100,nitro+8);cs.splice(i,1)}else if(q.y>640)cs.splice(i,1)}score+=v*dt*.07;if(keys.Space&&nitro>0)nitro=Math.max(0,nitro-32*dt);else nitro=Math.min(100,nitro+5*dt);hud()}function car(px,py,col){x.save();x.translate(px,py);x.fillStyle=col;x.shadowBlur=18;x.shadowColor=col;x.beginPath();x.roundRect(-24,-41,48,82,10);x.fill();x.shadowBlur=0;x.fillStyle='#101827';x.fillRect(-15,-25,30,20);x.fillRect(-15,8,30,17);x.fillStyle='#080b10';x.fillRect(-29,-20,6,18);x.fillRect(23,-20,6,18);x.fillRect(-29,14,6,18);x.fillRect(23,14,6,18);x.restore()}function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#081329');g.addColorStop(1,'#142a23');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#0a2219';x.fillRect(0,350,W,250);for(let i=0;i<20;i++){x.fillStyle='#101d30';x.fillRect(i*50,250-(i*37%120),38,100+(i*37%120))}x.fillStyle='#20252c';x.fillRect(road.x,0,road.w,H);x.fillStyle='#ddd';x.fillRect(road.x,0,5,H);x.fillRect(road.x+road.w-5,0,5,H);x.strokeStyle='#fff8';x.lineWidth=5;x.setLineDash([38,42]);x.lineDashOffset=-(d%80);for(let i=1;i<3;i++){x.beginPath();x.moveTo(road.x+i*road.w/3,0);x.lineTo(road.x+i*road.w/3,H);x.stroke()}x.setLineDash([]);cs.forEach(q=>{x.fillStyle='#ffd34d';x.beginPath();x.arc(q.x,q.y,10,0,7);x.fill()});obs.forEach(o=>car(o.x,o.y,'#ff4d5d'));car(p.x,p.y,'#19e6a2')}function loop(t){if(!run)return;let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}document.getElementById('start').onclick=startGame;;l.onpointerdown=()=>move(-1);r.onpointerdown=()=>move(1);b.onpointerdown=()=>keys.Space=true;b.onpointerup=()=>keys.Space=false;addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=0);draw();</script></body></html>
